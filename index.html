<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Volley Manager Italia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#e9eef5; --panel:#ffffff; --panel2:#f2f5fa; --ink:#0c1a2e; --muted:#576881; --line:#d7dfeb;
  --accent:#d6336c; --accent-ink:#ffffff; --accent-soft:#fbe4ed;
  --good:#17825a; --good-soft:#dff4ea; --bad:#c2352b; --bad-soft:#fde5e2; --warn:#a96a10; --warn-soft:#fbefd2;
  --navy:#0a1424; --navy2:#13253f; --rail-ink:#9fb1cb; --on-navy:#f2f6fd;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 10px 28px -16px rgba(12,32,64,.30);
  --team:#d6336c;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080f1b; --panel:#101a2b; --panel2:#162235; --ink:#e8eef8; --muted:#8fa0b8; --line:#1f2d45;
  --accent:#ff5c93; --accent-ink:#1a0710; --accent-soft:#3b1727;
  --good:#4fd1a0; --good-soft:#12362b; --bad:#ff8277; --bad-soft:#3d1a18; --warn:#e6b455; --warn-soft:#3a2c10;
  --navy:#050a14; --navy2:#0e1c32; --rail-ink:#8396b3;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 30px -18px rgba(0,0,0,.7); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);padding-inline:16px;padding-block:0;-webkit-tap-highlight-color:transparent}
#app{max-width:1180px;margin:0 auto;padding-block:16px 108px}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,5vw,52px);line-height:.98;letter-spacing:.005em;text-transform:uppercase}
h2{font-size:26px;line-height:1.05;letter-spacing:.01em}
h3{font-size:14px;line-height:1.2;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--accent);flex:none}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:2px;background:var(--navy);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.08)}
.nav button{flex:1;max-width:115px;display:grid;justify-items:center;gap:2px;border:0;background:none;color:var(--rail-ink);padding:7px 2px 6px;border-radius:12px;font:600 11px var(--f-disp);letter-spacing:.08em;text-transform:uppercase;min-height:52px;transition:background .15s,color .15s}
.nav button[aria-current="true"]{background:rgba(255,255,255,.1);color:#fff}
.nav button[aria-current="true"] .nav-icon{color:var(--accent)}
.nav-icon{display:grid;place-items:center;width:24px;height:24px}
.nav-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){
  body{padding-left:calc(100px + 28px);padding-right:28px}
  .nav{top:0;bottom:0;right:auto;width:100px;flex-direction:column;justify-content:flex-start;gap:6px;padding:22px 8px calc(16px + env(safe-area-inset-bottom,0px));border-top:0;border-right:1px solid rgba(255,255,255,.06)}
  .nav button{flex:none;max-width:none;width:100%;padding:12px 2px 10px;font-size:10.5px}
  #app{padding-block:22px 40px}
}
.top{display:flex;align-items:center;gap:14px;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand .crest{--cs:46px}
.brand b{display:block;font:700 24px/1 var(--f-disp);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crest{display:inline-block;flex:none;width:var(--cs,42px);height:var(--cs,42px)}
.crest svg{display:block;width:100%;height:100%}
.season-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.season-strip>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 14px;box-shadow:var(--shadow)}
.season-strip span{display:block;font:600 11px var(--f-disp);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.season-strip b{font:700 20px/1.15 var(--f-disp)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card>h3{margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:10px 16px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{font:700 20px var(--f-disp);letter-spacing:.05em;text-transform:uppercase;padding:12px 22px;min-height:54px;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.pill.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pill.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 16px;font-weight:600;min-height:40px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel2)}
.seg button{flex:1;border:0;background:none;padding:10px 8px;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select,input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px;width:100%}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 10px 25px rgba(0,0,0,.5)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font:600 11.5px var(--f-disp);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:4px}
th.l,td.l{text-align:left}
tr.me td{background:var(--accent-soft);font-weight:700}
tr.clickable:hover td{background:var(--panel2);cursor:pointer}
.team-cell{display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.ovr{display:inline-grid;place-items:center;min-width:34px;height:28px;border-radius:8px;font:700 17px var(--f-disp);color:#fff;padding:0 6px}
.prow{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.prow .nm b{display:block;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font:700 14px var(--f-disp);background:var(--panel2);border:1px solid var(--line)}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px;margin-top:10px}
.attrs div{display:grid;gap:4px}
.attrs span{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.slot{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hero{display:grid;gap:8px;margin-bottom:16px;border-radius:20px;padding:20px;color:var(--on-navy);background:linear-gradient(118deg,var(--navy) 0%,var(--navy2) 55%,color-mix(in srgb,var(--team) 60%,var(--navy)) 130%)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.vs .crest{--cs:74px}
.vs .nm{font:700 24px/1.05 var(--f-disp);text-transform:uppercase}
.cmp{display:grid;grid-template-columns:40px 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
.cmp .c{font:700 17px var(--f-disp);text-align:center}
.cmp .lab{text-align:center;color:var(--muted);font:600 11px var(--f-disp);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}
.cmp .tr{height:8px;border-radius:8px;background:var(--line);position:relative;overflow:hidden}
.cmp .tr i{position:absolute;top:0;bottom:0;left:0;background:var(--team)}
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.res.me{font-weight:700;color:var(--accent)}
.res .sc{font:700 20px var(--f-disp);text-align:center}
.pick{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.pick button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:72px}
.pick .crest{--cs:48px}
.pick .st{margin-left:auto;font:700 24px var(--f-disp);color:var(--muted)}
.arena{position:relative;border-radius:18px;overflow:hidden;background:#05080f;box-shadow:0 20px 40px -20px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.08)}
.arena .cv{display:block;width:100%;height:auto;touch-action:manipulation}
.scorebug{position:absolute;left:12px;top:12px;min-width:220px;max-width:60%;background:rgba(6,10,20,.88);backdrop-filter:blur(6px);color:#fff;border-radius:12px;overflow:hidden;font-family:var(--f-disp)}
.sb-ctx,.sb-set{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;background:rgba(255,255,255,.08);color:#b4c3dc}
.sb-row{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-left:5px solid var(--kit)}
.sb-row+.sb-row{border-top:1px solid rgba(255,255,255,.08)}
.sb-name{font-size:19px;flex:1;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-pts{font-size:30px;line-height:1;min-width:34px;text-align:right}
.srv{width:9px;height:9px;border-radius:50%;background:#ffd24a;flex:none}
.caption{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(6,10,20,.85);backdrop-filter:blur(6px);color:#fff;padding:9px 14px;border-radius:10px;font-weight:600;font-size:15px;border-left:4px solid var(--accent)}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:none;gap:14px;align-items:baseline;background:rgba(6,10,20,.94);color:#fff;padding:14px 28px;border-radius:14px;font-family:var(--f-disp);text-transform:uppercase;border:1px solid rgba(255,255,255,.15);z-index:15}
.banner.show{display:flex}
.banner span{font-size:16px;color:#ffd24a}.banner b{font-size:32px}.banner em{font-size:24px;font-style:normal}
.matchctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===== COLORI E STEMMI ===== */
const Gx = (() => {
  const hash = s => { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  const hex2rgb = h => { h = String(h || '#888888').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const lum = c => { const [r, g, b] = hex2rgb(c).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
  const kit = team => {
    const main = team.color || '#2563eb';
    return { main, shorts: lum(main) > .5 ? '#1a2233' : '#0e1524', trim: lum(main) > .5 ? '#111' : '#fff' };
  };
  const matchKits = (home, away) => ({ h: kit(home), a: kit(away) });
  return { hash, kit, matchKits };
})();

let _crestUid = 0;
function initials(t) {
  const stop = new Set(['di', 'del', 'della', 'dei', 'volley', 'pallavolo', 'club', 'asd', 'e', 'women']);
  const words = String(t.short || t.full || '?').replace(/[&+]/g, ' ').split(/[\s\-–']+/).filter(w => w && !stop.has(w.toLowerCase()));
  if (!words.length) return String(t.short || '?').slice(0, 3).toUpperCase();
  return (words[0][0] + (words[1] ? words[1][0] : '') + (words[2] ? words[2][0] : '')).toUpperCase().slice(0, 3);
}
function crestSVG(t, px) {
  const c1 = t.color || '#2563eb', txt = initials(t);
  const d = 'M32 3 L58 10 V32 C58 47 46 57 32 62 C18 57 6 47 6 32 V10 Z';
  return `<svg viewBox="0 0 64 64" width="${px || 42}" height="${px || 42}" xmlns="http://www.w3.org/2000/svg">
<path d="${d}" fill="${c1}" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
<text x="32" y="40" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-weight="700" font-size="${txt.length>=3?19:24}" fill="#ffffff" stroke="rgba(0,0,0,0.5)" stroke-width="2" paint-order="stroke">${esc(txt)}</text></svg>`;
}
const crest = (t, px) => `<span class="crest"${px ? ` style="--cs:${px}px"` : ''}>${crestSVG(t, px)}</span>`;

const SKIN = ['#f7d9c4', '#efc3a1', '#e0a981', '#c98b62'];
const HAIR = ['#14110f', '#2b1a12', '#4a2c1a', '#7a4a26', '#b07a3c', '#d8b36a'];
function avatarLook(p) {
  const h = Gx.hash((p && (p.id || p.name)) || 'x');
  return { skin: SKIN[h % SKIN.length], hair: HAIR[(h >> 2) % HAIR.length], style: (h >> 4) % 4 };
}
function avatar(p, px) {
  const L = avatarLook(p);
  const svg = `<svg viewBox="0 0 64 64" width="${px || 44}" height="${px || 44}" xmlns="http://www.w3.org/2000/svg">
<circle cx="32" cy="32" r="31" fill="#1e293b"/>
<ellipse cx="32" cy="30" rx="12" ry="14" fill="${L.skin}"/>
<circle cx="32" cy="22" r="14" fill="${L.hair}"/>
<circle cx="28" cy="30" r="1.5" fill="#111"/><circle cx="36" cy="30" r="1.5" fill="#111"/>
<path d="M29 37 Q32 39 35 37" stroke="#7a3b3b" stroke-width="1.4" fill="none"/>
</svg>`;
  return `<span class="avatar" style="position:relative;display:inline-block;width:${px||44}px;height:${px||44}px">${svg}<i class="av-role" style="position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:#0a1424;color:#fff;font:700 10px var(--f-disp);display:grid;place-items:center;font-style:normal">${esc(p.role||'')}</i></span>`;
}

/* ===== MODELLO 3D ATLETA ARTICOLATA ===== */
const POSE = {
  ready:    { cr: .30, ln: .20, lf: 0,   L: [.38, -.95], R: [.38, -.95] },
  walk:     { cr: .12, ln: .10, lf: 0,   L: [.25, -.40], R: [.25, -.40] },
  receive:  { cr: .72, ln: .55, lf: 0,   L: [.20, -.55], R: [.20, -.55] },
  bump:     { cr: .52, ln: .40, lf: .03, L: [-.02, -.10], R: [-.02, -.10] },
  setReady: { cr: .18, ln: .05, lf: 0,   L: [2.25, .40], R: [2.25, .40] },
  set:      { cr: .06, ln: 0,   lf: .05, L: [2.75, .25], R: [2.75, .25] },
  toss:     { cr: .10, ln: .05, lf: 0,   L: [3.00, 0],   R: [.55, -.80] },
  serveHit: { cr: .00, ln: .00, lf: .22, L: [.55, -.40], R: [3.05, .05] },
  cock:     { cr: .35, ln: .10, lf: .18, L: [2.45, .10], R: [1.95, 1.50] },
  spikeTop: { cr: .00, ln: -.05, lf: .78, L: [.70, -.40], R: [3.05, .08] },
  blockUp:  { cr: .05, ln: 0,   lf: .70, L: [3.05, 0],   R: [3.05, 0] },
  dive:     { cr: .96, ln: .95, lf: .02, L: [.15, .20],  R: [.15, .20] },
  cheer:    { cr: .05, ln: 0,   lf: .10, L: [2.75, .30], R: [2.75, .30] }
};
function poseBlend(a, b, f) {
  const k = Math.max(0, Math.min(1, f)), e = k * k * (3 - 2 * k);
  const m = (x, y) => x + (y - x) * e;
  return { cr: m(a.cr, b.cr), ln: m(a.ln, b.ln), lf: m(a.lf, b.lf), L: [m(a.L[0], b.L[0]), m(a.L[1], b.L[1])], R: [m(a.R[0], b.R[0]), m(a.R[1], b.R[1])] };
}

function drawFigure(c, X, Y, s, f) {
  const P = f.pose || POSE.ready, K = f.kit, look = f.look;
  const Yf = Y - P.lf * s;
  const hipY = Yf - (.86 - P.cr * .28) * s;
  const shY = hipY - .48 * s;

  // Ombra a terra proporzionata all'elevazione
  const shr = Math.max(.35, 1 - P.lf * .45);
  c.fillStyle = `rgba(5, 10, 20, ${0.34 * shr})`;
  c.beginPath(); c.ellipse(X, Y, .26 * s * shr, .085 * s * shr, 0, 0, 7); c.fill();

  // Gambe articolate con ginocchiere
  for (const side of [-1, 1]) {
    const hx = X + side * .075 * s, fx = X + side * (.1 + P.cr * .06) * s;
    const kx = (hx + fx) / 2 + side * (.03 + P.cr * .08) * s, ky = (hipY + Yf) / 2;
    c.strokeStyle = look.skin; c.lineWidth = .12 * s; c.lineCap = 'round';
    c.beginPath(); c.moveTo(hx, hipY); c.lineTo(kx, ky); c.lineTo(fx, Yf - .04 * s); c.stroke();
    // Ginocchiera
    c.fillStyle = '#1e293b'; c.beginPath(); c.arc(kx, ky, .044 * s, 0, 7); c.fill();
    // Scarpa
    c.fillStyle = '#f8fafc'; c.beginPath(); c.ellipse(fx, Yf - .015 * s, .065 * s, .035 * s, 0, 0, 7); c.fill();
  }

  // Pantaloncini
  c.fillStyle = K.shorts;
  c.fillRect(X - .15 * s, hipY - .04 * s, .3 * s, .18 * s);

  // Busto e divisa
  c.fillStyle = K.main;
  c.beginPath();
  c.moveTo(X - .14 * s, hipY); c.lineTo(X - .19 * s, shY);
  c.lineTo(X + .19 * s, shY); c.lineTo(X + .14 * s, hipY);
  c.closePath(); c.fill();

  // Braccia articolate
  const armPts = (side, a1, e) => {
    const sx = X + side * .19 * s, sy = shY + .03 * s;
    const ex = sx + side * Math.sin(a1) * .26 * s, ey = sy + Math.cos(a1) * .26 * s;
    const hx = ex + side * Math.sin(a1 + e) * .24 * s, hy = ey + Math.cos(a1 + e) * .24 * s;
    return { sx, sy, ex, ey, hx, hy };
  };
  for (const [sd, angs] of [[-1, P.L], [1, P.R]]) {
    const a = armPts(sd, angs[0], angs[1]);
    c.strokeStyle = look.skin; c.lineWidth = .08 * s; c.lineCap = 'round';
    c.beginPath(); c.moveTo(a.sx, a.sy); c.lineTo(a.ex, a.ey); c.lineTo(a.hx, a.hy); c.stroke();
    // Manica
    c.strokeStyle = K.main; c.lineWidth = .1 * s;
    c.beginPath(); c.moveTo(a.sx, a.sy); c.lineTo(a.sx + (a.ex - a.sx) * .35, a.sy + (a.ey - a.sy) * .35); c.stroke();
  }

  // Testa e capelli
  const headY = shY - .15 * s, headR = .115 * s;
  c.fillStyle = look.skin; c.beginPath(); c.arc(X, headY, headR, 0, 7); c.fill();
  c.fillStyle = look.hair;
  c.beginPath(); c.arc(X, headY - .01 * s, headR * 1.05, Math.PI, 0); c.fill();
  c.beginPath(); c.ellipse(X, headY + .04 * s, headR * .9, headR * .5, 0, 0, Math.PI); c.fill();
  if (look.style === 1) { // coda / chignon
    c.beginPath(); c.arc(X, headY - headR * 1.1, headR * .5, 0, 7); c.fill();
  }
}

/* ===== TELECAMERA 3D MULTI-ANGOLO ===== */
const Cam = { 
  W: 1280, H: 720, mode: "tv",
  Dc: 26, Hc: 12, tilt: 0.0, pan: 0.0, zoom: 1.0,
  F: 1000, K: 12000, hy: -100, cx: 640, xs: 1.4, portrait: false 
};

const CAM_PRESETS = {
  tv:       { Dc: 26, Hc: 12.0, tilt: 0.00, zoom: 1.00, xs: 1.40, label: "Regia TV" },
  side:     { Dc: 17, Hc: 4.2,  tilt: 0.08, zoom: 1.15, xs: 1.25, label: "Bordocampo" },
  endline:  { Dc: 24, Hc: 7.5,  tilt: -0.04, zoom: 0.95, xs: 1.65, label: "Fondo Campo" }
};

function setCamMode(mode) {
  if (!CAM_PRESETS[mode]) return;
  Cam.mode = mode;
  const p = CAM_PRESETS[mode];
  Cam.Dc = p.Dc; Cam.Hc = p.Hc; Cam.tilt = p.tilt; Cam.zoom = p.zoom; Cam.xs = p.xs;
  camSetup(Cam.W, Cam.H);
  if (UI.match && UI.match.arena) UI.match.arena = arenaBuild(UI.match, UI.match.k);
}

function camSetup(W, H) {
  Cam.W = W; Cam.H = H; Cam.portrait = H > W * 0.95;
  const zN = Math.max(2, Cam.Dc - 9), zF = Cam.Dc + 9;
  const top = (Cam.portrait ? 0.32 : 0.36) - Cam.tilt;
  const bot = (Cam.portrait ? 0.86 : 0.91) - Cam.tilt;
  Cam.K = H * (bot - top) / (1 / zN - 1 / zF);
  Cam.F = (Cam.K / Cam.Hc) * Cam.zoom;
  Cam.hy = H * bot - Cam.K / zN;
  Cam.cx = (W / 2) + Cam.pan;
  const half = (Cam.portrait ? 0.47 : 0.325) * W;
  Cam.xs = (half / (4.5 * Cam.F / zN)) * (CAM_PRESETS[Cam.mode]?.xs || 1.4);
}

function proj(u, v, zh) {
  const z = Math.max(1.5, Cam.Dc - u);
  const sc = Cam.F / z;
  return { 
    x: Cam.cx + v * sc * Cam.xs, 
    y: Cam.hy + (Cam.K / z) - ((zh || 0) * sc), 
    s: sc 
  };
}

function polyPath(c, pts) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)); c.closePath(); }
function lineWorld(c, u1, v1, u2, v2, wMeters, steps) {
  const n = steps || 1;
  for (let i = 0; i < n; i++) {
    const a = proj(u1 + (u2 - u1) * i / n, v1 + (v2 - v1) * i / n), b = proj(u1 + (u2 - u1) * (i + 1) / n, v1 + (v2 - v1) * (i + 1) / n);
    c.lineWidth = Math.max(1, wMeters * (a.s + b.s) / 2 * 1.15);
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
  }
}

function arenaBuild(M, k) {
  const W = Cam.W, H = Cam.H, cv = document.createElement('canvas');
  cv.width = Math.round(W * k); cv.height = Math.round(H * k);
  const c = cv.getContext('2d'); c.setTransform(k, 0, 0, k, 0, 0);
  c.fillStyle = '#0a1424'; c.fillRect(0, 0, W, H);
  const F = (u, v) => proj(u, v);
  c.fillStyle = '#163866'; polyPath(c, [F(-12, -8.6), F(-12, 8.6), F(12, 8.6), F(12, -8.6)]); c.fill();
  c.fillStyle = '#d29a5c'; polyPath(c, [F(-9, -4.5), F(-9, 4.5), F(9, 4.5), F(9, -4.5)]); c.fill();
  c.fillStyle = '#c58d50';
  polyPath(c, [F(-3, -4.5), F(-3, 4.5), F(0, 4.5), F(0, -4.5)]); c.fill();
  polyPath(c, [F(0, -4.5), F(0, 4.5), F(3, 4.5), F(3, -4.5)]); c.fill();
  c.strokeStyle = '#ffffff';
  lineWorld(c, -9, -4.5, -9, 4.5, .06, 1); lineWorld(c, 9, -4.5, 9, 4.5, .06, 1);
  lineWorld(c, -9, -4.5, 9, -4.5, .06, 8); lineWorld(c, -9, 4.5, 9, 4.5, .06, 8);
  lineWorld(c, 0, -4.5, 0, 4.5, .06, 1);
  lineWorld(c, -3, -4.5, -3, 4.5, .06, 1); lineWorld(c, 3, -4.5, 3, 4.5, .06, 1);
  return { cv };
}

function drawNet(c) {
  const a = proj(0, -5, 2.24), b = proj(0, 5, 2.24), b2 = proj(0, 5, 1.24), a2 = proj(0, -5, 1.24);
  c.fillStyle = 'rgba(8,12,22,.34)'; polyPath(c, [a, b, b2, a2]); c.fill();
  c.strokeStyle = '#f5f7fb'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
  c.beginPath(); c.moveTo(a2.x, a2.y); c.lineTo(b2.x, b2.y); c.stroke();
  for (const v of [-4.5, 4.5]) {
    const g = proj(0, v, 2.24), t = proj(0, v, 3.0);
    c.strokeStyle = '#ef4444'; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(g.x, g.y); c.lineTo(t.x, t.y); c.stroke();
  }
}

const STAR_BONUS = { "Paola Egonu": 9, "Zhu Ting": 9, "Monica De Gennaro": 7, "Anna Danesi": 6, "Wolosz": 5, "Ognjenovic": 4, "Sarah Fahr": 3, "Raphaela Folie": 3, "Caterina Bosetti": 3, "Elena Pietrini": 4, "Marina Lubian": 3, "Gabi": 5, "Skinner": 4, "Lanier": 3, "Stella Nervini": 3 };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ROLE_ORDER=["P","O","S","C","L"];
const SEASON_YEAR=2026;
const FIRST=["Giulia","Martina","Sara","Chiara","Alice","Elena","Francesca","Beatrice","Giorgia","Aurora","Sofia","Ilaria","Federica","Valentina","Silvia","Laura","Marta","Elisa","Camilla","Noemi","Arianna","Ginevra","Greta","Irene"];
const LAST=["Rossi","Ferrari","Bianchi","Romano","Colombo","Ricci","Marino","Greco","Bruno","Gallo","Conti","De Luca","Mancini","Costa","Giordano","Rizzo","Lombardi","Moretti","Barbieri","Fontana","Santoro","Mariani","Rinaldi","Caruso"];
const ROLE_ATTR={ P:{att:-18,blk:-8,srv:0,rec:-8,def:-2,set:5}, O:{att:4,blk:0,srv:0,rec:-20,def:-10,set:-30}, S:{att:0,blk:-6,srv:0,rec:4,def:2,set:-30}, C:{att:-1,blk:6,srv:-4,rec:-25,def:-10,set:-30}, L:{att:-30,blk:-30,srv:-10,rec:8,def:10,set:-15} };
const KEY_ATTR={P:"set",O:"att",S:"att",C:"blk",L:"rec"};

function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function calcETV(p){ const base = Math.pow(p.ovr / 40, 3.8) * 6500; return Math.round(base / 500) * 500; }
function salaryFor(p,lid){const tier=lid==="A1"?1:lid==="A2"?0.42:0.25;return Math.round((180+Math.pow(Math.max(35,p.ovr),2)*0.25)*tier/50)*50;}
function ensureContracts(team,lid){team.players.forEach(p=>{if(!p.wage)p.wage=salaryFor(p,lid);if(!p.contractYears)p.contractYears=2;});}
function payrollFor(team){return team.players.reduce((n,p)=>n+(p.wage||salaryFor(p,team.lid||G.lid)),0);}

function makePlayer(lid,team,i,raw,rng,gen){
  let role,name,nat="",year=0;
  if(gen){role=gen.role;name=gen.name;year=SEASON_YEAR-(17+Math.floor(rng()*4));nat="ITA";}
  else{const f=raw.split("|");role=f[0];name=f[1];nat=f[2]||"";year=f[3]?+f[3]:0;}
  const surnameOnly=!gen&&lid==="A1"&&name.indexOf(" ")<0;
  const base=lid==="A1"?58+team.tier*5.2:lid==="A2"?44+team.tier*4.2:38+team.tier*3.8;
  let ovr=base+gauss(rng)*4.0+(STAR_BONUS[name]||0)+(surnameOnly?3:0);
  if(!year)year=SEASON_YEAR-(20+Math.floor(rng()*14));
  const age=SEASON_YEAR-year;
  if(age<=19)ovr-=4;
  ovr=clamp(ovr,36,95);
  const ra=ROLE_ATTR[role],p={id:lid+":"+team.id+":"+i,name,role,nat,year,age,teamId:team.id,lid,fatigue:0,inj:0,injName:""};
  for(const k of ["att","blk","srv","rec","def","set"])p[k]=Math.round(clamp(ovr+ra[k]+gauss(rng)*2.3,25,98));
  p.ovr=p[KEY_ATTR[role]];
  p.pot=age<=21?Math.round(clamp(p.ovr+4+rng()*9,p.ovr,96)):p.ovr;
  p.val=calcETV(p);
  return p;
}

function generateFreeAgents(){
  const fa=[]; const rng=mulberry32(992026); let count=0;
  for(const role of ROLE_ORDER){
    for(let i=0;i<4;i++){
      const nm=FIRST[Math.floor(rng()*FIRST.length)]+" "+LAST[Math.floor(rng()*LAST.length)];
      const p=makePlayer("FA",{tier:2.8,id:"fa"},count++,null,rng,{role,name:nm});
      p.teamId=null;p.lid=null;
      fa.push(p);
    }
  }
  return fa.sort((a,b)=>b.ovr-a.ovr);
}

function buildWorld(){
  const W={A1:[],A2:[],A3A:[],A3B:[]};
  let seed=2026101;
  for(const lid of Object.keys(W)){
    LEAGUES[lid].teams.forEach((t,ti)=>{
      const rng=mulberry32(seed+ti*977+(lid.includes("A3")?8500:lid==="A2"?5000:0));
      const team={...t,lid,idx:ti,players:[]};
      (t.p||[]).forEach((raw,i)=>team.players.push(makePlayer(lid,team,i,raw,rng,null)));
      const need={P:2,O:2,S:4,C:4,L:2};
      let n=team.players.length;
      for(const role of ROLE_ORDER){
        const have=team.players.filter(x=>x.role===role).length;
        for(let k=have;k<need[role];k++){
          const nm=FIRST[Math.floor(rng()*FIRST.length)]+" "+LAST[Math.floor(rng()*LAST.length)];
          team.players.push(makePlayer(lid,team,n++,null,rng,{role,name:nm}));
        }
      }
      team.players.sort((a,b)=>ROLE_ORDER.indexOf(a.role)-ROLE_ORDER.indexOf(b.role)||b.ovr-a.ovr);
      W[lid].push(team);
    });
  }
  return W;
}

const WORLD=buildWorld();
const FREE_AGENTS=generateFreeAgents();
const PLAYER_INDEX={};
for(const lid of Object.keys(WORLD))for(const t of WORLD[lid])for(const p of t.players)PLAYER_INDEX[p.id]=p;
for(const p of FREE_AGENTS)PLAYER_INDEX[p.id]=p;

function autoLineup(team){
  const used=new Set();
  const pool=r=>{
    const own=team.players.filter(p=>p.role===r&&!used.has(p.id));
    const ok=own.filter(p=>!p.inj);
    const list=(ok.length?ok:own).sort((a,b)=>b.ovr-a.ovr);
    return list.length?list:team.players.filter(p=>!used.has(p.id)).sort((a,b)=>b.ovr-a.ovr);
  };
  const take=r=>{ const p=pool(r)[0]; if(!p)return undefined; used.add(p.id); return p.id; };
  return {P:take("P"),O:take("O"),S1:take("S"),S2:take("S"),C1:take("C"),C2:take("C"),L:take("L")};
}

function lineupValid(team,lu){
  if(!lu)return false;
  const need={P:"P",O:"O",S1:"S",S2:"S",C1:"C",C2:"C",L:"L"},seen={};
  for(const k in need){
    const p=PLAYER_INDEX[lu[k]];
    if(!p||p.teamId!==team.id||p.role!==need[k]||p.inj>0||seen[p.id])return false;
    seen[p.id]=1;
  }
  return true;
}

function ratingsOf(team,lu,tactic,rng,noise){
  const g=k=>PLAYER_INDEX[lu[k]];
  const P=g("P"),O=g("O"),S1=g("S1"),S2=g("S2"),C1=g("C1"),C2=g("C2"),L=g("L");
  const f=()=>noise?gauss(rng)*1.2:0;
  const starters=[P,O,S1,S2,C1,C2,L];
  const avgFatigue=starters.reduce((acc,pl)=>acc+(pl.fatigue||0),0)/7;
  const malus=avgFatigue>60?(avgFatigue-60)*0.25:0;
  let r={
    srv:((P.srv+O.srv+S1.srv+S2.srv+C1.srv+C2.srv)/6)-malus,
    rec:(L.rec*.38+S1.rec*.27+S2.rec*.27+O.rec*.08)-malus,
    att:(O.att*.28+S1.att*.22+S2.att*.22+C1.att*.14+C2.att*.14)-malus,
    blk:(C1.blk*.3+C2.blk*.3+O.blk*.2+S1.blk*.1+S2.blk*.1)-malus,
    def:(L.def*.35+S1.def*.2+S2.def*.2+P.def*.1+O.def*.1+C1.def*.025+C2.def*.025)-malus,
    set:P.set-malus
  };
  if(tactic==="srv"){r.srv+=5;r.att-=2;}
  else if(tactic==="def"){r.blk+=3;r.def+=3;r.srv-=3;}
  for(const k in r)r[k]+=f();
  return r;
}
function teamStrength(team,lu){const r=ratingsOf(team,lu,"bal",null,false);return (r.srv+r.rec+r.att+r.blk+r.def+r.set)/6;}

function pickW(items,wfn,rng){let tot=0;const ws=items.map(i=>{const w=Math.max(.01,wfn(i));tot+=w;return w;});let x=rng()*tot;for(let i=0;i<items.length;i++){x-=ws[i];if(x<=0)return items[i];}return items[items.length-1];}
function rotOf(lu){const g=k=>PLAYER_INDEX[lu[k]];return [g("P"),g("C1"),g("S1"),g("O"),g("C2"),g("S2")];}
function rotate(a){return [a[5],a[0],a[1],a[2],a[3],a[4]];}
function courtView(rot,lib){return rot.map((p,i)=>(i===1||i===2)&&p.role==="C"?{p:lib,lib:true}:{p,lib:false});}

function playRally(sideS,rots,libs,R,rng,homeSide,detail){
  const sideR=sideS==="h"?"a":"h";
  const rs=R[sideS],rr=R[sideR];
  let pR=.64+.0033*((.35*rr.rec+.40*rr.att+.25*rr.set)-(.38*rs.srv+.37*rs.blk+.25*rs.def));
  pR+=sideR===homeSide?.012:-.012;
  pR=clamp(pR,.42,.84);
  const recvWins=rng()<pR;
  const server=rots[sideS][0];
  const rview=courtView(rots[sideR],libs[sideR]);
  const sview=courtView(rots[sideS],libs[sideS]);
  const receiver=pickW(rview.map(x=>x.p),p=>p.role==="L"?3:p.role==="S"?1.6:p.role==="O"?.2:p.role==="P"?.15:.1,rng);
  const front=(rot)=>[rot[3],rot[4],rot[5]];
  const atkR=pickW(front(rots[sideR]),p=>Math.pow(p.att/70,3)*(p.role==="C"?.8:p.role==="P"?.12:1),rng);
  const atkS=pickW(front(rots[sideS]),p=>Math.pow(p.att/70,3)*(p.role==="C"?.8:p.role==="P"?.12:1),rng);
  const blkS=pickW(front(rots[sideS]),p=>Math.pow(p.blk/70,3)*(p.role==="C"?1.6:1),rng);
  const setterR=rots[sideR].find(p=>p.role==="P");
  let winner,type,actor=null,cred=null;
  if(recvWins){
    winner=sideR;
    if(rng()<.2){type="serr";}
    else{type="kill";actor=atkR;cred=atkR;}
  }else{
    winner=sideS;
    const x=rng();
    const aceP=.2+(R[sideS].srv-R[sideR].rec)*.004;
    if(x<aceP){type="ace";actor=server;cred=server;}
    else if(x<aceP+.3){type="block";actor=blkS;cred=blkS;}
    else if(x<aceP+.56){type="att";actor=atkS;cred=atkS;}
    else{type="rerr";}
  }
  return {sideS,sideR,winner,type,actor,cred,server,receiver,atkR,atkS,atk:recvWins?atkR:atkS,atkSide:recvWins?sideR:sideS,setter:setterR,blocker:blkS,
    sview:detail?sview:null,rview:detail?rview:null};
}

function simMatch(home,away,lineups,tactics,rng,detail){
  const R={h:ratingsOf(home,lineups.h,tactics.h,rng,true),a:ratingsOf(away,lineups.a,tactics.a,rng,true)};
  const libs={h:PLAYER_INDEX[lineups.h.L],a:PLAYER_INDEX[lineups.a.L]};
  const sets=[],pts={},rallies=[];
  let hs=0,as=0,set=0,firstServer=rng()<.5?"h":"a";
  while(hs<3&&as<3){
    set++;
    const target=set===5?15:25;
    let h=0,a=0;
    const rots={h:rotOf(lineups.h),a:rotOf(lineups.a)};
    let srv=set===5?(rng()<.5?"h":"a"):(set%2===1?firstServer:(firstServer==="h"?"a":"h"));
    let guard=0;
    while(!((h>=target||a>=target)&&Math.abs(h-a)>=2)&&guard++<150){
      const ry=playRally(srv,rots,libs,R,rng,"h",detail);
      if(ry.winner==="h")h++;else a++;
      if(ry.cred)pts[ry.cred.id]=(pts[ry.cred.id]||0)+1;
      if(detail){ry.set=set;ry.h=h;ry.a=a;ry.sets=[hs,as];rallies.push(ry);}
      if(ry.winner!==srv){rots[ry.winner]=rotate(rots[ry.winner]);srv=ry.winner;}
    }
    sets.push([h,a]);
    if(h>a)hs++;else as++;
  }
  return {sets,hs,as,pts,rallies};
}

function makeSchedule(n){
  const ids=[];for(let i=0;i<n;i++)ids.push(i);
  if(n%2)ids.push(-1);
  const m=ids.length,rounds=[];
  let arr=ids.slice();
  for(let r=0;r<m-1;r++){
    const pairs=[];
    for(let i=0;i<m/2;i++){
      let a=arr[i],b=arr[m-1-i];
      if(a===-1||b===-1)continue;
      if(i===0&&r%2===1){const t=a;a=b;b=t;}
      else if(i>0&&(r+i)%2===1){const t=a;a=b;b=t;}
      pairs.push([a,b]);
    }
    rounds.push(pairs);
    arr=[arr[0]].concat([arr[m-1]],arr.slice(1,m-1));
  }
  const second=rounds.map(rd=>rd.map(([a,b])=>[b,a]));
  return rounds.concat(second);
}
const SCHEDULE={A1:makeSchedule(14),A2:makeSchedule(17),A3A:makeSchedule(8),A3B:makeSchedule(8)};

function standings(lid,results){
  const teams=WORLD[lid]||[],tb=teams.map(t=>({idx:t.idx,id:t.id,short:t.short,pl:0,w:0,l:0,pts:0,sw:0,sl:0,pf:0,pa:0}));
  for(const rd of results[lid]||[])for(const m of rd){
    const H=tb[m.h],A=tb[m.a];
    if(!H||!A)continue;
    H.pl++;A.pl++;H.sw+=m.hs;H.sl+=m.as;A.sw+=m.as;A.sl+=m.hs;
    for(const s of m.sets){H.pf+=s[0];H.pa+=s[1];A.pf+=s[1];A.pa+=s[0];}
    if(m.hs>m.as){H.w++;A.l++;H.pts+=m.as<=1?3:2;A.pts+=m.as===2?1:0;}
    else{A.w++;H.l++;A.pts+=m.hs<=1?3:2;H.pts+=m.hs===2?1:0;}
  }
  tb.sort((a,b)=>b.pts-a.pts||b.w-a.w||(b.sw/Math.max(1,b.sl))-(a.sw/Math.max(1,a.sl))||(b.pf/Math.max(1,b.pa))-(a.pf/Math.max(1,a.pa))||a.idx-b.idx);
  return tb;
}
function lineupFor(G,team){
  if(G&&team.lid===G.lid&&team.idx===G.teamIdx&&lineupValid(team,G.lineup))return G.lineup;
  return autoLineup(team);
}
function packMatch(h,a,r){return {h,a,sets:r.sets,hs:r.hs,as:r.as};}

function playRound(G,userRes){
  const rnd=G.round;
  const userLeague=G.lid;
  const activeLeagues=Object.keys(SCHEDULE).filter(l=>SCHEDULE[l]);

  for(const lid of activeLeagues){
    const sched=SCHEDULE[lid];
    if(!sched||rnd>=sched.length)continue;
    if(!G.results[lid])G.results[lid]=[];
    if(G.results[lid].length>rnd)continue;
    const out=[];
    for(const [hi,ai] of sched[rnd]){
      const home=WORLD[lid][hi],away=WORLD[lid][ai];
      if(userRes&&lid===userLeague&&(hi===G.teamIdx||ai===G.teamIdx)){out.push(packMatch(hi,ai,userRes));continue;}
      const isU=lid===userLeague&&(hi===G.teamIdx||ai===G.teamIdx);
      const tac={h:isU&&hi===G.teamIdx?G.tactic:"bal",a:isU&&ai===G.teamIdx?G.tactic:"bal"};
      const r=simMatch(home,away,{h:lineupFor(G,home),a:lineupFor(G,away)},tac,Math.random,false);
      out.push(packMatch(hi,ai,r));
    }
    G.results[lid].push(out);
  }

  for(const lid of Object.keys(WORLD)){
    for(const t of WORLD[lid]){
      const lu=lineupFor(G,t);
      const starters=new Set(Object.values(lu));
      t.players.forEach(p=>{
        if(p.inj>0){
          p.inj--;
          if(p.inj===0)p.injName="";
        }
        if(starters.has(p.id)){
          p.fatigue=clamp((p.fatigue||0)+18,0,100);
          const injProb=p.fatigue>70?0.08:0.015;
          if(Math.random()<injProb&&p.inj===0){
            p.inj=p.fatigue>70?2:3;
            p.injName=p.fatigue>70?"Sovraccarico alla spalla":"Distorsione alla caviglia";
            if(t.id===myTeam().id)toast(`Infortunio: ${p.name} (${p.injName})`);
          }
        }else{
          p.fatigue=clamp((p.fatigue||0)-35,0,100);
        }
      });
    }
  }
  if(!lineupValid(myTeam(),G.lineup))G.lineup=autoLineup(myTeam());

  ensureContracts(myTeam(),G.lid);
  G.budget-=payrollFor(myTeam());
  G.round=rnd+1;

  if(G.phase===1&&G.results["A3A"]&&G.results["A3A"].length>=14&&G.results["A3B"]&&G.results["A3B"].length>=14){
    G.phase=2;
    const stA=standings("A3A",G.results);
    const stB=standings("A3B",G.results);
    WORLD["A3_PROM"]=[]; WORLD["A3_RETR"]=[];
    for(let i=0;i<4;i++){
      WORLD["A3_PROM"].push({...WORLD["A3A"][stA[i].idx]});
      WORLD["A3_PROM"].push({...WORLD["A3B"][stB[i].idx]});
    }
    for(let i=4;i<8;i++){
      WORLD["A3_RETR"].push({...WORLD["A3A"][stA[i].idx]});
      WORLD["A3_RETR"].push({...WORLD["A3B"][stB[i].idx]});
    }
    WORLD["A3_PROM"].forEach((t,i)=>{t.lid="A3_PROM";t.idx=i;});
    WORLD["A3_RETR"].forEach((t,i)=>{t.lid="A3_RETR";t.idx=i;});
    LEAGUES["A3_PROM"]={name:"Serie A3 - Pool Promozione",rounds:14,teams:WORLD["A3_PROM"]};
    LEAGUES["A3_RETR"]={name:"Serie A3 - Pool Retrocessione",rounds:14,teams:WORLD["A3_RETR"]};
    SCHEDULE["A3_PROM"]=makeSchedule(8); SCHEDULE["A3_RETR"]=makeSchedule(8);
    delete SCHEDULE["A3A"]; delete SCHEDULE["A3B"];
    G.results["A3_PROM"]=[]; G.results["A3_RETR"]=[];

    if(G.lid==="A3A"||G.lid==="A3B"){
      const isFromA=G.lid==="A3A";
      const oldRank=(isFromA?stA:stB).findIndex(r=>r.idx===G.teamIdx);
      const oldId=WORLD[G.lid][G.teamIdx].id;
      G.lid=oldRank<4?"A3_PROM":"A3_RETR";
      G.teamIdx=WORLD[G.lid].findIndex(t=>t.id===oldId);
      G.round=0;
      toast("Fase 1 conclusa: Iniziano le Pool di Serie A3!");
    }
  }
}

function nextFixture(G){
  const sched=SCHEDULE[G.lid];
  if(!sched||G.round>=sched.length)return null;
  for(const [h,a] of sched[G.round])if(h===G.teamIdx||a===G.teamIdx)return {h,a,home:h===G.teamIdx};
  return {rest:true};
}

const BASE=[[2.4,7.6],[2.6,4.5],[2.4,1.4],[7.0,1.4],[7.0,4.5],[7.0,7.6]];
function rallyUV(M, side, i) {
  const sg = side === M.userSide ? 1 : -1, b = BASE[i];
  return [sg * (9 - b[0]), (b[1] - 4.5) * sg];
}

function sizeCanvas() {
  const M = UI.match, cv = $("#cv"); if (!cv || !M) return;
  const portrait = window.innerHeight > window.innerWidth * 1.05 && window.innerWidth < 900;
  const W = portrait ? 900 : 1280, H = portrait ? 1100 : 720;
  cv.style.aspectRatio = `${W} / ${H}`;
  const cssW = cv.clientWidth || 800, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cv.width * H / W);
  M.k = cv.width / W; camSetup(W, H);
  M.arena = arenaBuild(M, M.k);
}

function buildScript(M, ry) {
  const S = ry.sideS, R = ry.sideR;
  const sS = S === M.userSide ? 1 : -1, sR = R === M.userSide ? 1 : -1;
  const tracks = {}, ball = [];
  const key = (pid, t, u, v, pose) => { (tracks[pid] || (tracks[pid] = [])).push({ t, u, v, pose: POSE[pose] || POSE.ready }); };
  const seg = (t0, d, A, B, arc) => ball.push({ t0, t1: t0 + d, A, B, arc: arc || 0 });

  const su = sS * 9.5, sv = 0;
  seg(0, 0.6, [su, sv, 1.2], [su, sv, 2.8], 0.5);
  key(ry.server.id, 0, su, sv, 'toss');
  key(ry.server.id, 0.6, su, sv, 'serveHit');

  const tgt = [sR * 6.5, 0];
  seg(0.6, 0.8, [su, sv, 2.8], [tgt[0], tgt[1], 1.0], 2.2);
  key(ry.receiver.id, 0.6, tgt[0], tgt[1], 'receive');
  key(ry.receiver.id, 1.4, tgt[0], tgt[1], 'bump');

  const setPos = [sR * 1.5, 1.0];
  seg(1.4, 0.7, [tgt[0], tgt[1], 1.0], [setPos[0], setPos[1], 2.4], 2.0);
  key(ry.setter.id, 1.4, setPos[0], setPos[1], 'setReady');
  key(ry.setter.id, 2.1, setPos[0], setPos[1], 'set');

  const atkPos = [sR * 0.9, -1.0];
  seg(2.1, 0.45, [setPos[0], setPos[1], 2.4], [atkPos[0], atkPos[1], 3.1], 1.2);
  key(ry.atkR.id, 1.8, atkPos[0] + sR*1.5, atkPos[1], 'cock');
  key(ry.atkR.id, 2.55, atkPos[0], atkPos[1], 'spikeTop');

  let land = [sS * 4.5, 0];
  if(ry.type==="serr") land = [sR * 9.8, 0];
  else if(ry.type==="kill") land = [sS * 5.0, 1.5];
  else if(ry.type==="block") land = [sR * 2.0, -1.0];
  else land = [sS * 9.8, 0];

  seg(2.55, 0.45, [atkPos[0], atkPos[1], 3.1], [land[0], land[1], 0], 0.2);
  return { tracks, ball, point: 3.0, end: 3.8 };
}

function sampleTrack(tr, t) {
  if (!tr || !tr.length) return null;
  if (t <= tr[0].t) return tr[0];
  for (let i = 0; i < tr.length - 1; i++) {
    if (t >= tr[i].t && t <= tr[i + 1].t) {
      const f = (t - tr[i].t) / (tr[i + 1].t - tr[i].t);
      return { u: tr[i].u + (tr[i+1].u - tr[i].u) * f, v: tr[i].v + (tr[i+1].v - tr[i].v) * f, pose: poseBlend(tr[i].pose, tr[i+1].pose, f) };
    }
  }
  return tr[tr.length - 1];
}

function sampleBall(ball, t) {
  if (!ball.length) return null;
  if (t <= ball[0].t0) return { u: ball[0].A[0], v: ball[0].A[1], z: ball[0].A[2] };
  for (const s of ball) {
    if (t >= s.t0 && t <= s.t1) {
      const f = (t - s.t0) / (s.t1 - s.t0);
      return { 
        u: s.A[0] + (s.B[0] - s.A[0]) * f, 
        v: s.A[1] + (s.B[1] - s.A[1]) * f, 
        z: s.A[2] + (s.B[2] - s.A[2]) * f + s.arc * 4 * f * (1 - f) 
      };
    }
  }
  const l = ball[ball.length - 1];
  return { u: l.B[0], v: l.B[1], z: l.B[2] };
}

function startNext() {
  const M = UI.match;
  if (M.i >= M.res.rallies.length) { finishMatch(); return; }
  const ry = M.res.rallies[M.i], script = buildScript(M, ry);
  const next = M.res.rallies[M.i + 1], setEnd = !next || next.set !== ry.set;
  M.anim = { ry, script, t: 0, scored: false, setEnd };
  $("#sv-h").style.visibility = ry.sideS === 'h' ? 'visible' : 'hidden';
  $("#sv-a").style.visibility = ry.sideS === 'a' ? 'visible' : 'hidden';
}

function updateBoard(ry, setEnd) {
  const M = UI.match;
  $("#sc-h").textContent = ry.h; $("#sc-a").textContent = ry.a;
  $("#sv-h").style.visibility = ry.winner === 'h' ? 'visible' : 'hidden';
  $("#sv-a").style.visibility = ry.winner === 'a' ? 'visible' : 'hidden';
  if (setEnd) {
    if (M) {
      M.timeoutsLeft = 2;
      const b = document.getElementById("to-badge");
      if (b) b.textContent = "Time-out disp: 2";
    }
    if (ry.h > ry.a) M.sh++; else M.sa++;
    M.setScores.push([ry.h, ry.a]);
    $("#setline").innerHTML = M.setScores.map((s, i) => `<span class="pill">Set ${i + 1}: ${s[0]}-${s[1]}</span>`).join('');
    $("#sets").textContent = `SET ${ry.set} CHIUSO · ${M.sh}-${M.sa}`;
  } else {
    $("#sets").textContent = `SET ${ry.set} · ${M.sh}-${M.sa}`;
  }
}

function tick(ts) {
  const M = UI.match; if (!M) return;
  M.raf = requestAnimationFrame(tick);
  const dt = Math.min(.05, (ts - M.last) / 1000 || 0); M.last = ts;
  if (!M.done && !M.paused) {
    if (!M.anim) startNext();
    else {
      const a = M.anim; a.t += dt * M.speed;
      if (!a.scored && a.t >= a.script.point) {
        a.scored = true;
        updateBoard(a.ry, a.setEnd);
        $("#feed").textContent = feedText(a.ry);
      }
      if (a.t >= a.script.end) {
        M.i++; M.anim = null;
        if (M.i >= M.res.rallies.length) finishMatch();
      }
    }
    M.t += dt;
  }
  drawScene(M);
}

function feedText(ry) {
  const n = p => p ? p.name : "";
  switch(ry.type){
    case "ace": return `Ace vincente di ${n(ry.server)}!`;
    case "block": return `Muro punto di ${n(ry.blocker)}!`;
    case "kill": return `Attacco a segno di ${n(ry.atkR)}.`;
    case "serr": return `Errore al servizio di ${n(ry.server)}.`;
    default: return `Punto chiuso.`;
  }
}

function drawScene(M) {
  const cv = $("#cv"); if (!cv || !M.arena) return;
  const c = cv.getContext('2d'), W = Cam.W, H = Cam.H;
  c.setTransform(M.k, 0, 0, M.k, 0, 0);
  c.drawImage(M.arena.cv, 0, 0, W, H);

  const a = M.anim, t = a ? a.t : 0, ents = [];
  for (const side of ['h', 'a']) {
    M.view[side].forEach((o, i) => {
      const p = o.p, tr = a ? a.script.tracks[p.id] : null;
      let u, v, pose = POSE.ready;
      const sm = tr ? sampleTrack(tr, t) : null;
      if (sm) { u = sm.u; v = sm.v; pose = sm.pose; }
      else { const b = rallyUV(M, side, i); u = b[0]; v = b[1]; }
      ents.push({ kind: 'p', side, p, u, v, pose });
    });
  }

  let ballPos = null;
  if (a) {
    ballPos = sampleBall(a.script.ball, t);
    if (ballPos) ents.push({ kind: 'b', u: ballPos.u, v: ballPos.v, z: ballPos.z });
  }

  // Ordinamento di profondità corretto rispetto al punto di vista
  ents.sort((x, y) => x.u - y.u);
  let netDrawn = false;
  for (const e of ents) {
    if (!netDrawn && e.u >= 0) { drawNet(c); netDrawn = true; }
    if (e.kind === 'b') { drawBall(c, e); continue; }
    const pr = proj(e.u, e.v);
    const kit = M.kits[e.side];
    const look = e.p._look || (e.p._look = avatarLook(e.p));
    drawFigure(c, pr.x, pr.y, pr.s, { pose: e.pose, kit, look });
  }
  if (!netDrawn) drawNet(c);
}

function drawBall(c, b) {
  const g = proj(b.u, b.v, 0);
  const p = proj(b.u, b.v, b.z);
  const r = Math.max(4.5, 0.16 * p.s * (1 + b.z * 0.05));

  // Linea di quota altitudine (Drop-line 3D)
  if (b.z > 0.4) {
    c.strokeStyle = "rgba(255, 255, 255, 0.35)";
    c.lineWidth = 1.2;
    c.setLineDash([3, 3]);
    c.beginPath(); c.moveTo(g.x, g.y); c.lineTo(p.x, p.y); c.stroke();
    c.setLineDash([]);
  }

  // Ombra sfumata a terra
  const shSpread = Math.max(0.3, 1 - b.z * 0.14);
  c.fillStyle = `rgba(5, 10, 25, ${0.4 * shSpread})`;
  c.beginPath();
  c.ellipse(g.x, g.y, r * 1.2 * shSpread, r * 0.45 * shSpread, 0, 0, 7);
  c.fill();

  // Palla con sfumatura e colorazione gara
  c.save();
  c.translate(p.x, p.y);
  c.fillStyle = '#ffffff';
  c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
  c.fillStyle = '#1d4ed8';
  c.beginPath(); c.arc(0, 0, r, -0.6, 1.2); c.fill();
  c.fillStyle = '#facc15';
  c.beginPath(); c.arc(0, 0, r, 1.6, 2.8); c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.4)';
  c.lineWidth = 1;
  c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke();
  c.restore();
}

function skipMatch(){
  const M=UI.match;if(!M||M.done)return;
  const rs=M.res.rallies;
  M.setScores=[];M.sh=0;M.sa=0;
  rs.forEach((ry,j)=>{const nx=rs[j+1];if(!nx||nx.set!==ry.set){M.setScores.push([ry.h,ry.a]);if(ry.h>ry.a)M.sh++;else M.sa++;}});
  const last=rs[rs.length-1];
  $("#sc-h").textContent=last.h;$("#sc-a").textContent=last.a;
  $("#sets").textContent=`FINALE · ${M.sh}-${M.sa}`;
  $("#setline").innerHTML=M.setScores.map((s,i)=>`<span class="pill">Set ${i+1}: ${s[0]}-${s[1]}</span>`).join("");
  M.anim=null;M.i=rs.length;finishMatch();
}

function finishMatch(){
  const M=UI.match;if(!M||M.done)return;
  M.done=true;
  const res=M.res,mine=M.fx.home?[res.hs,res.as]:[res.as,res.hs];
  const win=mine[0]>mine[1];
  const pts=win?(mine[1]<=1?3:2):(mine[0]===2?1:0);
  const inc=M.fx.home?(win?8500:4200):(win?2500:800);
  G.budget+=inc;

  $("#feed").textContent=`Finale: ${M.home.short} ${res.hs}-${res.as} ${M.away.short}.`;
  $("#sets").textContent=`FINALE · ${res.hs}-${res.as}`;
  $("#ctl").innerHTML="";
  $("#sum").innerHTML=`<div class="card" style="margin-top:6px">
    <h3>${win?"Vittoria":"Sconfitta"} · ${pts} punti</h3>
    <p class="muted small">Incasso gara accreditato: <b style="color:var(--good)">+${formatEur(inc)}</b></p>
    <div class="row" style="margin-top:14px"><button class="btn primary big" data-act="endmatch">Continua</button></div>
  </div>`;
}

function endMatch(){
  const M=UI.match;if(!M)return;
  cancelAnimationFrame(M.raf);
  playRound(G,M.res);
  persist();
  UI.match=null;UI.tab="home";
  render();window.scrollTo(0,0);
}

function buyPlayer(pid){
  const p=G.freeAgents.find(x=>x.id===pid);
  if(!p)return;
  const cost=p.val||calcETV(p);
  if(G.budget<cost){toast("Budget insufficiente!");return;}
  G.budget-=cost;
  G.freeAgents=G.freeAgents.filter(x=>x.id!==pid);
  p.teamId=myTeam().id;
  p.lid=G.lid;
  p.fatigue=0;
  p.inj=0;
  myTeam().players.push(p);
  myTeam().players.sort((a,b)=>ROLE_ORDER.indexOf(a.role)-ROLE_ORDER.indexOf(b.role)||b.ovr-a.ovr);
  toast(`Acquisto completato: ${p.name}!`);
  persist();render();
}

function sellPlayer(pid){
  const t=myTeam();
  const idx=t.players.findIndex(x=>x.id===pid);
  if(idx<0)return;
  const p=t.players[idx];
  const price=Math.round((p.val||calcETV(p))*0.85);
  t.players.splice(idx,1);
  p.teamId=null;p.lid=null;
  G.freeAgents.push(p);
  G.budget+=price;
  toast(`Cessione: ${p.name} per ${formatEur(price)}!`);
  persist();render();
}

/* ===== GESTIONE EVENTI E INTERAZIONI ===== */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.tagName==="SELECT")return;
  const act=el.dataset.act,v=el.dataset.v;
  if(act==="start"){newGame(el.dataset.lid,+el.dataset.i);return;}
  if(act==="continue"){
    const s=loadLocal();
    if(validSave(s)){
      G=s;UI.lg=G.lid;
      if(!G.budget)G.budget=initBudget(G.lid,myTeam().tier);
      if(!G.freeAgents)G.freeAgents=FREE_AGENTS.slice();
      if(!lineupValid(myTeam(),G.lineup))G.lineup=autoLineup(myTeam());
      render();
    }
    return;
  }
  if(act==="cam"){
    setCamMode(v);
    document.querySelectorAll('[data-act="cam"]').forEach(b=>b.style.borderColor=b.dataset.v===v?"var(--accent)":"rgba(255,255,255,0.2)");
    return;
  }
  if(act==="calltimeout"){
    const M=UI.match;
    if(!M||M.done||M.paused)return;
    if(M.timeoutsLeft<=0){toast("Hai esaurito i time-out per questo set!");return;}
    M.timeoutsLeft--;
    document.getElementById("to-badge").textContent=`Time-out disp: ${M.timeoutsLeft}`;
    M.paused=true;
    myTeam().players.forEach(p=>{p.fatigue=clamp((p.fatigue||0)-8,0,100);});
    toast("Time-out: la squadra rifiata (-8% fatica).");
    const b=$("#banner");
    b.innerHTML=`<span>TIME-OUT TATTICO</span><b>${esc(myTeam().short)}</b><em>Indicazioni del Coach</em>`;
    b.hidden=false;b.className="banner show";
    setTimeout(()=>{
      if(b){b.hidden=true;b.className="banner";}
      if(M&&!M.done)M.paused=false;
    },2200);
    return;
  }
  if(act==="livesub"){
    const M=UI.match;
    if(!M||M.done)return;
    M.paused=true;
    const modal=document.getElementById("live-modal");
    const lu=lineupFor(G,myTeam());
    const bench=myTeam().players.filter(p=>!Object.values(lu).includes(p.id)&&!p.inj);
    modal.innerHTML=`
    <div class="card" style="margin-top:10px;border:2px solid var(--accent)">
      <div class="row" style="justify-content:space-between">
        <h3>Sostituzione Volante</h3>
        <button class="btn" data-act="closesub">Annulla</button>
      </div>
      <p class="muted small">Seleziona una giocatrice fresca dalla panchina:</p>
      <div class="grid" style="gap:8px;max-height:220px;overflow-y:auto">
        ${bench.map(p=>`
          <div class="prow" style="padding:6px 0">
            ${avatar(p,36)}
            <span class="nm"><b>${esc(p.name)}</b><span class="muted small">${p.role} · OVR ${p.ovr} · Fatica ${p.fatigue||0}%</span></span>
            <button class="btn primary" style="min-height:32px;padding:4px 8px;font-size:12px" data-act="applysub" data-pid="${p.id}" data-role="${p.role}">Metti dentro</button>
          </div>
        `).join("")}
      </div>
    </div>`;
    return;
  }
  if(act==="closesub"){
    document.getElementById("live-modal").innerHTML="";
    if(UI.match&&!UI.match.done)UI.match.paused=false;
    return;
  }
  if(act==="applysub"){
    const M=UI.match;
    const pid=el.dataset.pid,role=el.dataset.role;
    const lu=G.lineup||autoLineup(myTeam());
    let slotKey=null;
    if(role==="P")slotKey="P";
    else if(role==="O")slotKey="O";
    else if(role==="L")slotKey="L";
    else if(role==="S")slotKey=lu.S1?"S2":"S1";
    else if(role==="C")slotKey=lu.C1?"C2":"C1";
    if(slotKey){
      lu[slotKey]=pid;
      G.lineup=lu;
      persist();
      toast(`Cambio: entra ${PLAYER_INDEX[pid].name}.`);
    }
    document.getElementById("live-modal").innerHTML="";
    if(M&&!M.done)M.paused=false;
    return;
  }
  if(act==="viewroster"){
    UI.inspectLid=el.dataset.lid;
    UI.inspectTeam=el.dataset.teamid;
    UI.tab="scout";
    UI.sel=null;
    render();window.scrollTo(0,0);
    return;
  }
  if(act==="scoutlid"){
    UI.inspectLid=v;
    UI.inspectTeam=null;
    UI.sel=null;
    render();
    return;
  }
  if(act==="speed"){if(!UI.match)return;UI.match.speed=+v;document.querySelectorAll('[data-act="speed"]').forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));return;}
  if(act==="pause"){const M=UI.match;if(!M)return;M.paused=!M.paused;el.textContent=M.paused?"Riprendi":"Pausa";return;}
  if(act==="skip"){skipMatch();return;}
  if(act==="endmatch"){endMatch();return;}
  if(!G)return;
  if(act==="tab"){UI.tab=v;UI.sel=null;render();window.scrollTo(0,0);}
  else if(act==="mkttab"){UI.mktTab=v;render();}
  else if(act==="buyplayer"){buyPlayer(el.dataset.id);}
  else if(act==="sellplayer"){sellPlayer(el.dataset.id);}
  else if(act==="tactic"){G.tactic=v;persist();render();}
  else if(act==="play"){startMatch();window.scrollTo(0,0);}
  else if(act==="quick"){
    const fx=nextFixture(G);if(!fx||fx.rest)return;
    const home=WORLD[G.lid][fx.h],away=WORLD[G.lid][fx.a];
    const res=simMatch(home,away,{h:lineupFor(G,home),a:lineupFor(G,away)},{h:fx.home?G.tactic:"bal",a:fx.home?"bal":G.tactic},Math.random,false);
    const win=(fx.home?res.hs:res.as)>(fx.home?res.as:res.hs);
    const inc=fx.home?(win?8500:4200):(win?2500:800);
    G.budget+=inc;
    playRound(G,res);persist();render();
  }
  else if(act==="rest"){playRound(G,null);persist();render();}
  else if(act==="newseason"){
    G.round=0;G.season++;G.phase=1;
    G.results={A1:[],A2:[],A3A:[],A3B:[]};
    if(G.lid.includes("A3"))G.lid="A3A";
    G.budget+=Math.round(initBudget(G.lid,myTeam().tier)*0.6);
    persist();render();window.scrollTo(0,0);
  }
  else if(act==="reset"){if(!UI.confirm){UI.confirm=true;render();}else{UI.confirm=false;try{localStorage.removeItem(SAVE_KEY);}catch(x){}G=null;render();window.scrollTo(0,0);}}
  else if(act==="noreset"){UI.confirm=false;render();}
  else if(act==="player"){UI.sel=UI.sel===el.dataset.id?null:el.dataset.id;render();}
  else if(act==="autolineup"){G.lineup=autoLineup(myTeam());persist();render();}
  else if(act==="lg"){UI.lg=v;UI.rd=null;render();}
  else if(act==="lgtab"){UI.lgTab=v;render();}
  else if(act==="rd"){UI.rd=(UI.rd||0)+ +v;render();}
});

document.addEventListener("change",e=>{
  const el=e.target;if(!G)return;
  if(el.dataset.act==="scoutteam"){
    UI.inspectTeam=el.value;
    UI.sel=null;
    render();
    return;
  }
  if(el.dataset.act==="slot"){
    const lu={...lineupFor(G,myTeam())};lu[el.dataset.k]=el.value;
    if(lineupValid(myTeam(),lu)){G.lineup=lu;persist();render();}
  }
});

window.addEventListener("resize",()=>{if(UI.match)sizeCanvas();});

(function boot(){
  const s=loadLocal();
  if(validSave(s)){
    G=s;UI.lg=G.lid;
    if(!G.budget)G.budget=initBudget(G.lid,myTeam().tier);
    if(!G.freeAgents)G.freeAgents=FREE_AGENTS.slice();
    ensureContracts(myTeam(),G.lid);
    if(!lineupValid(myTeam(),G.lineup))G.lineup=autoLineup(myTeam());
  }
  render();
})();
</script>
