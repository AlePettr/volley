<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Volley Manager Italia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f5f7fb; --ink:#101828; --muted:#5b6678; --line:#d8dee8;
  --accent:#d6336c; --accent-ink:#ffffff; --accent-soft:#fbe3ec;
  --good:#1f8a5b; --bad:#c8372d; --warn:#b7791f;
  --court:#dcaa68; --court2:#d29d58; --zone:#34578a; --cline:#ffffff; --teamA:#d6336c; --teamB:#1f5fbf;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c121c; --panel:#151e2c; --panel2:#1b2638; --ink:#eaf0f8; --muted:#93a0b5; --line:#26324a;
  --accent:#ff5c93; --accent-ink:#1a0710; --accent-soft:#3a1626;
  --good:#47c58f; --bad:#ff7b70; --warn:#e3b04b;
  --court:#b6824c; --court2:#ab7742; --zone:#1b3052; --cline:#f2f5fa; --teamA:#ff5c93; --teamB:#5aa2ff; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--f-body);padding-inline:16px;padding-block:0;-webkit-tap-highlight-color:transparent}
#app{max-width:980px;margin:0 auto;padding-block:14px 96px}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:34px;line-height:1.05} h2{font-size:24px} h3{font-size:18px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px}
.crest{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:700 20px var(--f-disp);color:#fff;flex:none}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand b{display:block;font:700 22px/1.05 var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{font:700 22px var(--f-disp);letter-spacing:.04em;text-transform:uppercase;padding:14px 22px;min-height:56px}
.btn[disabled]{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.pill.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.good{background:#e8f7f0;color:var(--good);border-color:transparent}
.pill.bad{background:#fde8e8;color:var(--bad);border-color:transparent}
.pill.warn{background:#fef3c7;color:var(--warn);border-color:transparent}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--panel);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:4px;z-index:5}
.nav button{flex:1;max-width:140px;border:0;background:none;padding:8px 2px;border-radius:12px;font:600 14px var(--f-disp);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-height:48px}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 16px;font-weight:600;min-height:42px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:600 12px var(--f-disp);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:2px}
th.l,td.l{text-align:left}
tr.me td{background:var(--accent-soft);font-weight:600}
tr.zone-up td:first-child{box-shadow:inset 3px 0 var(--good)}
tr.zone-down td:first-child{box-shadow:inset 3px 0 var(--bad)}
.team-cell{display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.ovr{display:inline-grid;place-items:center;min-width:34px;height:28px;border-radius:8px;font:700 17px var(--f-disp);color:#fff;padding:0 6px}
.prow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;border-radius:0}
.prow .nm{min-width:0}
.prow .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font:700 15px var(--f-disp);background:var(--panel2);border:1px solid var(--line)}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;margin-top:12px}
.attrs div{display:grid;gap:4px}
.attrs span{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.slot{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:46px;width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:12px 8px;font-weight:600;min-height:46px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.vs .nm{font:700 24px/1.05 var(--f-disp);text-wrap:balance}
.vs .at{font:600 15px var(--f-disp);color:var(--muted)}
.cmp{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.cmp .c{font:700 16px var(--f-disp);text-align:center}
.cmp .lab{text-align:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.cmp .tr{height:8px;border-radius:8px;background:var(--line);position:relative;overflow:hidden}
.cmp .tr i{position:absolute;top:0;bottom:0;left:0;background:var(--teamA)}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:#0b1220;color:#f1f5fb;border-radius:14px;padding:12px 14px}
.score .t{font:700 20px/1.05 var(--f-disp);text-transform:uppercase;letter-spacing:.03em}
.score .t.r{text-align:right}
.score .sc{font:700 52px/1 var(--f-disp);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.score .sets{font:600 14px var(--f-disp);color:#9fb0c8;text-align:center;letter-spacing:.06em}
.score .srv{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ffd24a;margin:0 6px}
.cv{display:block;width:100%;height:auto;border-radius:14px;touch-action:manipulation}
.feed{font-size:15px;min-height:46px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.setline{display:flex;gap:8px;flex-wrap:wrap}
.setline .pill{font:600 14px var(--f-disp);font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.res .r{text-align:right}
.res.me{font-weight:600;color:var(--accent)}
.res .sc{font:700 18px var(--f-disp);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.pick{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.pick button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.pick button b{display:block;font-weight:600;line-height:1.15}
.pick .st{margin-left:auto;font:700 18px var(--f-disp)}
.hero{display:grid;gap:8px;margin-bottom:14px}
.sub{font-size:15px;color:var(--muted);max-width:60ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:9}
@media (max-width:560px){
  h1{font-size:30px} .score .sc{font-size:42px} .attrs{grid-template-columns:repeat(2,1fr)} .slot{grid-template-columns:90px 1fr}
  .vs .nm{font-size:20px} .nav button{font-size:12px}
}
</style>
</head>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const LAST=["Rossi","Ferrari","Bianchi","Romano","Colombo","Ricci","Marino","Greco","Bruno","Gallo","Conti","De Luca","Mancini","Costa","Giordano","Rizzo","Lombardi","Moretti","Barbieri","Fontana","Santoro","Mariani","Rinaldi","Caruso"];

const ROLE_ATTR={
  P:{att:-18,blk:-8,srv:0,rec:-8,def:-2,set:5},
  O:{att:4,blk:0,srv:0,rec:-20,def:-10,set:-30},
  S:{att:0,blk:-6,srv:0,rec:4,def:2,set:-30},
  C:{att:-1,blk:6,srv:-4,rec:-25,def:-10,set:-30},
  L:{att:-30,blk:-30,srv:-10,rec:8,def:10,set:-15}
};
const KEY_ATTR={P:"set",O:"att",S:"att",C:"blk",L:"rec"};

function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

function calcETV(p){
  const baseFactor = Math.pow(p.ovr / 40, 3.8);
  let val = baseFactor * 6500;
  if(p.age <= 21) val *= 1.35;
  if(p.age >= 32) val *= 0.75;
  return Math.round(val / 500) * 500;
}

function makePlayer(lid,team,i,raw,rng,gen){
  let role,name,nat="",year=0;
  if(gen){role=gen.role;name=gen.name;year=SEASON_YEAR-(17+Math.floor(rng()*4));nat="ITA";}
  else{const f=raw.split("|");role=f[0];name=f[1];nat=f[2]||"";year=f[3]?+f[3]:0;}
  const surnameOnly=!gen&&lid==="A1"&&name.indexOf(" ")<0;
  const base=lid==="A1"?58+team.tier*5.2:lid==="A2"?44+team.tier*4.2:38+team.tier*3.8;
  let ovr=base+gauss(rng)*4.5+(STAR_BONUS[name]||0)+(surnameOnly?3:0);
  let est=false;
  if(!year){year=SEASON_YEAR-(20+Math.floor(rng()*14));est=true;}
  const age=SEASON_YEAR-year;
  if(age<=19)ovr-=4;
  if(gen)ovr-=9;
  ovr=clamp(ovr,36,95);
  const ra=ROLE_ATTR[role],p={id:lid+":"+team.id+":"+i,name,role,nat,year,age,est,gen:!!gen,teamId:team.id,lid,fatigue:0,inj:0,injName:""};
  for(const k of ["att","blk","srv","rec","def","set"])p[k]=Math.round(clamp(ovr+ra[k]+gauss(rng)*3,25,98));
  p.ovr=p[KEY_ATTR[role]];
  p.pot=age<=21?Math.round(clamp(p.ovr+4+rng()*9,p.ovr,96)):p.ovr;
  p.val=calcETV(p);
  return p;
}

function generateFreeAgents(){
  const fa=[];
  const rng=mulberry32(992026);
  let count=0;
  for(const role of ROLE_ORDER){
    for(let i=0;i<4;i++){
      const nm=FIRST[Math.floor(rng()*FIRST.length)]+" "+LAST[Math.floor(rng()*LAST.length)];
      const dummyTeam={tier:2.8,id:"fa"};
      const p=makePlayer("FA",dummyTeam,count++,null,rng,{role,name:nm});
      p.teamId=null;p.lid=null;
      fa.push(p);
    }
  }
  return fa.sort((a,b)=>b.ovr-a.ovr);
}

function buildWorld(){
  const W={A1:[],A2:[],A3A:[],A3B:[]};
  let seed=2026101;
  for(const lid of Object.keys(W)){
    LEAGUES[lid].teams.forEach((t,ti)=>{
      const rng=mulberry32(seed+ti*977+(lid.includes("A3")?8500:lid==="A2"?5000:0));
      const team={...t,lid,idx:ti,players:[]};
      (t.p||[]).forEach((raw,i)=>team.players.push(makePlayer(lid,team,i,raw,rng,null)));
      const need={P:2,O:2,S:4,C:4,L:2};
      let n=team.players.length;
      for(const role of ROLE_ORDER){
        const have=team.players.filter(x=>x.role===role).length;
        for(let k=have;k<need[role];k++){
          const nm=FIRST[Math.floor(rng()*FIRST.length)]+" "+LAST[Math.floor(rng()*LAST.length)];
          team.players.push(makePlayer(lid,team,n++,null,rng,{role,name:nm}));
        }
      }
      team.players.sort((a,b)=>ROLE_ORDER.indexOf(a.role)-ROLE_ORDER.indexOf(b.role)||b.ovr-a.ovr);
      W[lid].push(team);
    });
  }
  return W;
}

const PLAYER_INDEX={};
for(const lid of Object.keys(WORLD))for(const t of WORLD[lid])for(const p of t.players)PLAYER_INDEX[p.id]=p;
for(const p of FREE_AGENTS)PLAYER_INDEX[p.id]=p;

function autoLineup(team){
  const by=r=>{
    const avail=team.players.filter(p=>p.role===r&&(!p.inj||p.inj===0)).sort((a,b)=>b.ovr-a.ovr);
    return avail.length>0?avail:team.players.filter(p=>p.role===r).sort((a,b)=>b.ovr-a.ovr);
  };
  return {P:by("P")[0].id,O:by("O")[0].id,S1:by("S")[0].id,S2:by("S")[1].id,C1:by("C")[0].id,C2:by("C")[1].id,L:by("L")[0].id};
}

function lineupValid(team,lu){
  if(!lu)return false;
  const need={P:"P",O:"O",S1:"S",S2:"S",C1:"C",C2:"C",L:"L"},seen={};
  for(const k in need){
    const p=PLAYER_INDEX[lu[k]];
    if(!p||p.teamId!==team.id||p.role!==need[k]||p.inj>0||seen[p.id])return false;
    seen[p.id]=1;
  }
  return true;
}

function ratingsOf(team,lu,tactic,rng,noise){
  const g=k=>PLAYER_INDEX[lu[k]];
  const P=g("P"),O=g("O"),S1=g("S1"),S2=g("S2"),C1=g("C1"),C2=g("C2"),L=g("L");
  const f=()=>noise?gauss(rng)*1.2:0;

  const starters=[P,O,S1,S2,C1,C2,L];
  const avgFatigue=starters.reduce((acc,pl)=>acc+(pl.fatigue||0),0)/7;
  const malus=avgFatigue>60?(avgFatigue-60)*0.25:0;

  let r={
    srv:((P.srv+O.srv+S1.srv+S2.srv+C1.srv+C2.srv)/6)-malus,
    rec:(L.rec*.38+S1.rec*.27+S2.rec*.27+O.rec*.08)-malus,
    att:(O.att*.28+S1.att*.22+S2.att*.22+C1.att*.14+C2.att*.14)-malus,
    blk:(C1.blk*.3+C2.blk*.3+O.blk*.2+S1.blk*.1+S2.blk*.1)-malus,
    def:(L.def*.35+S1.def*.2+S2.def*.2+P.def*.1+O.def*.1+C1.def*.025+C2.def*.025)-malus,
    set:P.set-malus
  };
  if(tactic==="srv"){r.srv+=5;r.att-=2;}
  else if(tactic==="def"){r.blk+=3;r.def+=3;r.srv-=3;}
  for(const k in r)r[k]+=f();
  return r;
}
function teamStrength(team,lu){const r=ratingsOf(team,lu,"bal",null,false);return (r.srv+r.rec+r.att+r.blk+r.def+r.set)/6;}

function pickW(items,wfn,rng){let tot=0;const ws=items.map(i=>{const w=Math.max(.01,wfn(i));tot+=w;return w;});let x=rng()*tot;for(let i=0;i<items.length;i++){x-=ws[i];if(x<=0)return items[i];}return items[items.length-1];}
function rotOf(lu){const g=k=>PLAYER_INDEX[lu[k]];return [g("P"),g("C1"),g("S1"),g("O"),g("C2"),g("S2")];}
function rotate(a){return [a[5],a[0],a[1],a[2],a[3],a[4]];}
function courtView(rot,lib){return rot.map((p,i)=>(i===1||i===2)&&p.role==="C"?{p:lib,lib:true}:{p,lib:false});}

function playRally(sideS,rots,libs,R,rng,homeSide,detail){
  const sideR=sideS==="h"?"a":"h";
  const rs=R[sideS],rr=R[sideR];
  let pR=.64+.0033*((.35*rr.rec+.40*rr.att+.25*rr.set)-(.38*rs.srv+.37*rs.blk+.25*rs.def));
  pR+=sideR===homeSide?.012:-.012;
  pR=clamp(pR,.42,.84);
  const recvWins=rng()<pR;
  const server=rots[sideS][0];
  const rview=courtView(rots[sideR],libs[sideR]);
  const sview=courtView(rots[sideS],libs[sideS]);
  const receiver=pickW(rview.map(x=>x.p),p=>p.role==="L"?3:p.role==="S"?1.6:p.role==="O"?.2:p.role==="P"?.15:.1,rng);
  const front=(rot)=>[rot[3],rot[4],rot[5]];
  const atkR=pickW(front(rots[sideR]),p=>Math.pow(p.att/70,3)*(p.role==="C"?.8:p.role==="P"?.12:1),rng);
  const atkS=pickW(front(rots[sideS]),p=>Math.pow(p.att/70,3)*(p.role==="C"?.8:p.role==="P"?.12:1),rng);
  const blkS=pickW(front(rots[sideS]),p=>Math.pow(p.blk/70,3)*(p.role==="C"?1.6:1),rng);
  const setterR=rots[sideR].find(p=>p.role==="P");
  let winner,type,actor=null,cred=null;
  if(recvWins){
    winner=sideR;
    if(rng()<.2){type="serr";}
    else{type="kill";actor=atkR;cred=atkR;}
  }else{
    winner=sideS;
    const x=rng();
    const aceP=.2+(R[sideS].srv-R[sideR].rec)*.004;
    if(x<aceP){type="ace";actor=server;cred=server;}
    else if(x<aceP+.3){type="block";actor=blkS;cred=blkS;}
    else if(x<aceP+.56){type="att";actor=atkS;cred=atkS;}
    else{type="rerr";}
  }
  return {sideS,sideR,winner,type,actor,cred,server,receiver,atkR,atkS,atk:recvWins?atkR:atkS,atkSide:recvWins?sideR:sideS,setter:setterR,blocker:blkS,
    sview:detail?sview:null,rview:detail?rview:null};
}

function simMatch(home,away,lineups,tactics,rng,detail){
  const R={h:ratingsOf(home,lineups.h,tactics.h,rng,true),a:ratingsOf(away,lineups.a,tactics.a,rng,true)};
  const libs={h:PLAYER_INDEX[lineups.h.L],a:PLAYER_INDEX[lineups.a.L]};
  const sets=[],pts={},rallies=[];
  let hs=0,as=0,set=0,firstServer=rng()<.5?"h":"a";
  while(hs<3&&as<3){
    set++;
    const target=set===5?15:25;
    let h=0,a=0;
    const rots={h:rotOf(lineups.h),a:rotOf(lineups.a)};
    let srv=set===5?(rng()<.5?"h":"a"):(set%2===1?firstServer:(firstServer==="h"?"a":"h"));
    let guard=0;
    while(!((h>=target||a>=target)&&Math.abs(h-a)>=2)&&guard++<150){
      const ry=playRally(srv,rots,libs,R,rng,"h",detail);
      if(ry.winner==="h")h++;else a++;
      if(ry.cred)pts[ry.cred.id]=(pts[ry.cred.id]||0)+1;
      if(detail){ry.set=set;ry.h=h;ry.a=a;ry.sets=[hs,as];rallies.push(ry);}
      if(ry.winner!==srv){rots[ry.winner]=rotate(rots[ry.winner]);srv=ry.winner;}
    }
    sets.push([h,a]);
    if(h>a)hs++;else as++;
  }
  return {sets,hs,as,pts,rallies};
}

function makeSchedule(n){
  const ids=[];for(let i=0;i<n;i++)ids.push(i);
  if(n%2)ids.push(-1);
  const m=ids.length,rounds=[];
  let arr=ids.slice();
  for(let r=0;r<m-1;r++){
    const pairs=[];
    for(let i=0;i<m/2;i++){
      let a=arr[i],b=arr[m-1-i];
      if(a===-1||b===-1)continue;
      if(i===0&&r%2===1){const t=a;a=b;b=t;}
      else if(i>0&&(r+i)%2===1){const t=a;a=b;b=t;}
      pairs.push([a,b]);
    }
    rounds.push(pairs);
    arr=[arr[0]].concat([arr[m-1]],arr.slice(1,m-1));
  }
  const second=rounds.map(rd=>rd.map(([a,b])=>[b,a]));
  return rounds.concat(second);
}
const SCHEDULE={A1:makeSchedule(14),A2:makeSchedule(17),A3A:makeSchedule(8),A3B:makeSchedule(8)};

function standings(lid,results){
  const teams=WORLD[lid]||[],tb=teams.map(t=>({idx:t.idx,id:t.id,short:t.short,pl:0,w:0,l:0,pts:0,sw:0,sl:0,pf:0,pa:0}));
  for(const rd of results[lid]||[])for(const m of rd){
    const H=tb[m.h],A=tb[m.a];
    if(!H||!A)continue;
    H.pl++;A.pl++;H.sw+=m.hs;H.sl+=m.as;A.sw+=m.as;A.sl+=m.hs;
    for(const s of m.sets){H.pf+=s[0];H.pa+=s[1];A.pf+=s[1];A.pa+=s[0];}
    if(m.hs>m.as){H.w++;A.l++;H.pts+=m.as<=1?3:2;A.pts+=m.as===2?1:0;}
    else{A.w++;H.l++;A.pts+=m.hs<=1?3:2;H.pts+=m.hs===2?1:0;}
  }
  tb.sort((a,b)=>b.pts-a.pts||b.w-a.w||(b.sw/Math.max(1,b.sl))-(a.sw/Math.max(1,a.sl))||(b.pf/Math.max(1,b.pa))-(a.pf/Math.max(1,a.pa))||a.idx-b.idx);
  return tb;
}
function lineupFor(G,team){
  if(G&&team.lid===G.lid&&team.idx===G.teamIdx&&lineupValid(team,G.lineup))return G.lineup;
  return autoLineup(team);
}
function packMatch(h,a,r){return {h,a,sets:r.sets,hs:r.hs,as:r.as};}

function playRound(G,userRes){
  const rnd=G.round;
  const userLeague=G.lid;
  const activeLeagues=Object.keys(SCHEDULE).filter(l=>SCHEDULE[l]);

  for(const lid of activeLeagues){
    const sched=SCHEDULE[lid];
    if(!sched||rnd>=sched.length)continue;
    if(!G.results[lid])G.results[lid]=[];
    if(G.results[lid].length>rnd)continue;
    const out=[];
    for(const [hi,ai] of sched[rnd]){
      const home=WORLD[lid][hi],away=WORLD[lid][ai];
      if(userRes&&lid===userLeague&&(hi===G.teamIdx||ai===G.teamIdx)){out.push(packMatch(hi,ai,userRes));continue;}
      const isU=lid===userLeague&&(hi===G.teamIdx||ai===G.teamIdx);
      const tac={h:isU&&hi===G.teamIdx?G.tactic:"bal",a:isU&&ai===G.teamIdx?G.tactic:"bal"};
      const r=simMatch(home,away,{h:lineupFor(G,home),a:lineupFor(G,away)},tac,Math.random,false);
      out.push(packMatch(hi,ai,r));
    }
    G.results[lid].push(out);
  }

  // Monitoraggio medico a fine giornata: fatica, recupero e infortuni
  for(const lid of Object.keys(WORLD)){
    for(const t of WORLD[lid]){
      const lu=lineupFor(G,t);
      const starters=new Set(Object.values(lu));
      t.players.forEach(p=>{
        if(p.inj>0){
          p.inj--;
          if(p.inj===0)p.injName="";
        }
        if(starters.has(p.id)){
          p.fatigue=clamp((p.fatigue||0)+18,0,100);
          const injProb=p.fatigue>70?0.08:0.015;
          if(Math.random()<injProb&&p.inj===0){
            if(p.fatigue>70){
              p.inj=Math.floor(Math.random()*2)+1;
              p.injName="Sovraccarico alla spalla";
            }else{
              p.inj=Math.floor(Math.random()*3)+2;
              p.injName="Distorsione alla caviglia";
            }
            if(t.id===myTeam().id)toast(`Infortunio: ${p.name} (${p.injName}, ${p.inj}t stop)`);
          }
        }else{
          p.fatigue=clamp((p.fatigue||0)-35,0,100);
        }
      });
    }
  }
  if(!lineupValid(myTeam(),G.lineup))G.lineup=autoLineup(myTeam());

  G.round=rnd+1;

  // Transizione Serie A3 alle Pool
  if(G.phase===1&&G.results["A3A"]&&G.results["A3A"].length>=14&&G.results["A3B"]&&G.results["A3B"].length>=14){
    G.phase=2;
    const stA=standings("A3A",G.results);
    const stB=standings("A3B",G.results);

    WORLD["A3_PROM"]=[];
    WORLD["A3_RETR"]=[];

    for(let i=0;i<4;i++){
      WORLD["A3_PROM"].push({...WORLD["A3A"][stA[i].idx]});
      WORLD["A3_PROM"].push({...WORLD["A3B"][stB[i].idx]});
    }
    for(let i=4;i<8;i++){
      WORLD["A3_RETR"].push({...WORLD["A3A"][stA[i].idx]});
      WORLD["A3_RETR"].push({...WORLD["A3B"][stB[i].idx]});
    }

    WORLD["A3_PROM"].forEach((t,i)=>{t.lid="A3_PROM";t.idx=i;});
    WORLD["A3_RETR"].forEach((t,i)=>{t.lid="A3_RETR";t.idx=i;});

    LEAGUES["A3_PROM"]={name:"Serie A3 - Pool Promozione",rounds:14,teams:WORLD["A3_PROM"]};
    LEAGUES["A3_RETR"]={name:"Serie A3 - Pool Retrocessione",rounds:14,teams:WORLD["A3_RETR"]};

    SCHEDULE["A3_PROM"]=makeSchedule(8);
    SCHEDULE["A3_RETR"]=makeSchedule(8);
    delete SCHEDULE["A3A"];
    delete SCHEDULE["A3B"];

    G.results["A3_PROM"]=[];
    G.results["A3_RETR"]=[];

    if(G.lid==="A3A"||G.lid==="A3B"){
      const isFromA=G.lid==="A3A";
      const oldRank=(isFromA?stA:stB).findIndex(r=>r.idx===G.teamIdx);
      const oldId=WORLD[G.lid][G.teamIdx].id;
      G.lid=oldRank<4?"A3_PROM":"A3_RETR";
      G.teamIdx=WORLD[G.lid].findIndex(t=>t.id===oldId);
      G.round=0;
      toast("Fine Regular Season: Iniziano le Pool di Serie A3!");
    }
  }
}

function nextFixture(G){
  const sched=SCHEDULE[G.lid];
  if(!sched||G.round>=sched.length)return null;
  for(const [h,a] of sched[G.round])if(h===G.teamIdx||a===G.teamIdx)return {h,a,home:h===G.teamIdx};
  return {rest:true};
}

const BASE=[[2.4,7.6],[2.6,4.5],[2.4,1.4],[7.0,1.4],[7.0,4.5],[7.0,7.6]];
const NETX=10.5;
const slotXY=(side,i)=>{const [bx,by]=BASE[i];return side==="h"?[1.5+bx,1.5+by]:[19.5-bx,10.5-by];};
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,f)=>a+(b-a)*f;

function startMatch(){

}

function sizeCanvas(){
  const cv=$("#cv");if(!cv)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||600;
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr*12/21);

const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function readColors(){return {zone:cssv("--zone"),court:cssv("--court"),court2:cssv("--court2"),line:cssv("--cline"),a:cssv("--teamA"),b:cssv("--teamB")};}
function posOf(view,side,pid){let i=view[side].findIndex(x=>x.p.id===pid);if(i<0)i=1;return slotXY(side,i);}

function buildRally(ry){
  const M=UI.match,view={};view[ry.sideS]=ry.sview;view[ry.sideR]=ry.rview;
  const S=ry.sideS,R=ry.sideR,sgn=R==="h"?-1:1;
  const sx=S==="h"?0.6:20.4,srvXY=[sx,slotXY(S,0)[1]];
  const rp=posOf(view,R,ry.receiver.id);
  const steps=[],ov={},act=[ry.server.id];
  const landR=()=>[R==="h"?rnd(2.5,8.5):rnd(12.5,18.5),rnd(2.5,8.5)];
  steps.push({a:srvXY,b:[rp[0]+rnd(-.6,.6),rp[1]+rnd(-.5,.5)],d:.75,arc:2.2,ov:{[ry.server.id]:srvXY},act:[ry.server.id]});
  if(ry.type==="serr"){
    steps[0].b=Math.random()<.5?[R==="h"?.6:20.4,rnd(2,9)]:[NETX,rnd(2.5,8.5)];
    return {steps,view};
  }
  if(ry.type==="ace"){steps[0].act=[ry.server.id,ry.receiver.id];return {steps,view};}
  const setT=[NETX+sgn*1.3,R==="h"?1.5+6.1:10.5-6.1];
  steps.push({a:null,b:setT,d:.55,arc:2,ov:{[ry.setter.id]:setT},act:[ry.receiver.id,ry.setter.id]});
  const aIdx=view[R].findIndex(x=>x.p.id===ry.atkR.id);
  const aNet=[NETX+sgn*.9,slotXY(R,aIdx<0?4:aIdx)[1]];
  steps.push({a:setT,b:aNet,d:.45,arc:2.4,ov:{[ry.setter.id]:setT,[ry.atkR.id]:aNet},act:[ry.setter.id,ry.atkR.id]});
  if(ry.type==="kill"){
    steps.push({a:aNet,b:[S==="h"?rnd(2.5,8.5):rnd(12.5,18.5),rnd(2.5,8.5)],d:.4,arc:.8,ov:{[ry.atkR.id]:aNet},act:[ry.atkR.id]});
  }else if(ry.type==="rerr"){
    steps.push({a:aNet,b:Math.random()<.4?[NETX,aNet[1]]:[S==="h"?rnd(.2,1):rnd(20,20.8),rnd(1,10)],d:.4,arc:.8,ov:{[ry.atkR.id]:aNet},act:[ry.atkR.id]});
  }else if(ry.type==="block"){
    const bl=[NETX-sgn*.9,aNet[1]];
    steps.push({a:aNet,b:[NETX,aNet[1]],d:.25,arc:.4,ov:{[ry.atkR.id]:aNet,[ry.blocker.id]:bl},act:[ry.atkR.id,ry.blocker.id]});
    steps.push({a:[NETX,aNet[1]],b:[NETX+sgn*rnd(1.2,3),aNet[1]+rnd(-1,1)],d:.35,arc:1,ov:{[ry.blocker.id]:bl},act:[ry.blocker.id]});
  }else{
    const back=view[S].map((x,i)=>({x,i})).filter(o=>o.i<3&&o.x.p.role!=="P");
    const dg=back[Math.floor(Math.random()*back.length)]||{x:view[S][1],i:1};
    const dgXY=slotXY(S,dg.i);
    steps.push({a:aNet,b:dgXY,d:.45,arc:1,ov:{[ry.atkR.id]:aNet},act:[ry.atkR.id,dg.x.p.id]});
    const sT=[NETX-sgn*1.3,S==="h"?1.5+6.1:10.5-6.1];
    steps.push({a:dgXY,b:sT,d:.5,arc:2,ov:{},act:[dg.x.p.id]});
    const bIdx=view[S].findIndex(x=>x.p.id===ry.atkS.id);
    const bNet=[NETX-sgn*.9,slotXY(S,bIdx<0?4:bIdx)[1]];
    steps.push({a:sT,b:bNet,d:.4,arc:2.2,ov:{[ry.atkS.id]:bNet},act:[ry.atkS.id]});
    steps.push({a:bNet,b:landR(),d:.4,arc:.8,ov:{[ry.atkS.id]:bNet},act:[ry.atkS.id]});
  }
  for(let k=1;k<steps.length;k++)if(!steps[k].a)steps[k].a=steps[k-1].b;
  steps[1].a=steps[0].b;
  return {steps,view};
}
function feedText(ry){
  const n=p=>p?p.name:"";
  switch(ry.type){
    case"ace":return `Ace di ${n(ry.server)}!`;
    case"block":return `Muro di ${n(ry.blocker)}.`;
    case"att":return `${n(ry.atkS)} a segno in contrattacco.`;
    case"kill":return `Punto in attacco di ${n(ry.atkR)}.`;
    case"serr":return `Errore in battuta per ${n(ry.server)}.`;
    default:return `Errore offensivo di ${n(ry.atkR)}.`;

}
function updateBoard(ry,setEnd){

function startNext(){
  const M=UI.match;
  if(M.i>=M.res.rallies.length){finishMatch();return;}
  const ry=M.res.rallies[M.i],b=buildRally(ry);
  M.view[ry.sideS]=b.view[ry.sideS];M.view[ry.sideR]=b.view[ry.sideR];
  M.anim={ry,steps:b.steps,si:0,t:0,stage:"steps",wait:0};
  $("#sv-h").style.visibility=ry.sideS==="h"?"visible":"hidden";
  $("#sv-a").style.visibility=ry.sideS==="a"?"visible":"hidden";

function tick(ts){
  const M=UI.match;if(!M)return;
  M.raf=requestAnimationFrame(tick);
  const dt=Math.min(.05,(ts-M.last)/1000||0);M.last=ts;
  if(!M.done&&!M.paused){
    if(!M.anim){startNext();}
    else{
      const a=M.anim;
      if(a.stage==="steps"){
        a.t+=dt*M.speed;
        const s=a.steps[a.si];
        if(a.t>=s.d){a.si++;a.t=0;
          if(a.si>=a.steps.length){
            a.stage="after";
            const ry=a.ry,next=M.res.rallies[M.i+1],setEnd=!next||next.set!==ry.set;
            updateBoard(ry,setEnd);
            $("#feed").textContent=feedText(ry)+(setEnd?` Set ${ry.set} a ${ry.h>ry.a?M.home.short:M.away.short}.`:"");
            a.wait=setEnd?1.1:.5;
          }
        }
      }else{
        a.wait-=dt*M.speed;
        if(a.wait<=0){M.i++;M.anim=null;if(M.i>=M.res.rallies.length)finishMatch();}
      }
    }
  }
  if(M.frame++%90===0)M.colors=readColors();
  drawCourt();
}
function drawCourt(){

  const c=cv.getContext("2d"),k=cv.width/21,col=M.colors||(M.colors=readColors());

  c.fillStyle=col.court2;for(let i=0;i<18;i+=2)c.fillRect((1.5+i)*k,1.5*k,k,9*k);
  c.strokeStyle=col.line;c.lineWidth=.1*k;c.strokeRect(1.5*k,1.5*k,18*k,9*k);
  c.beginPath();for(const x of [7.5,13.5]){c.moveTo(x*k,1.5*k);c.lineTo(x*k,10.5*k);}c.stroke();
  c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=.16*k;c.beginPath();c.moveTo(NETX*k,.85*k);c.lineTo(NETX*k,11.15*k);c.stroke();
  c.fillStyle="#222";for(const y of [.85,11.15]){c.beginPath();c.arc(NETX*k,y*k,.2*k,0,7);c.fill();}
  const a=M.anim,ov={},act=new Set();let ball=null,ry=a?a.ry:null,st=null;
  if(a&&a.stage==="steps"){st=a.steps[a.si];for(let j=0;j<=a.si;j++)Object.assign(ov,a.steps[j].ov||{});(st.act||[]).forEach(x=>act.add(x));}
  else if(a&&a.stage==="after"){a.steps.forEach(s=>Object.assign(ov,s.ov||{}));}
  for(const side of ["h","a"]){

    M.view[side].forEach((o,i)=>{
      const p=o.p;let xy=slotXY(side,i);
      if(ov[p.id])xy=ov[p.id];
      else if(a&&a.stage==="steps"&&i===0&&ry&&ry.sideS===side&&a.si===0)xy=[side==="h"?0.6:20.4,xy[1]];
      else if(!a&&M.i===0&&i===0){xy=[side==="h"?.6:20.4,xy[1]];}

      c.fillStyle="rgba(0,0,0,.22)";c.beginPath();c.ellipse(x,y+.2*k,r,r*.55,0,0,7);c.fill();
      c.fillStyle=o.lib?"#ffd24a":fill;c.beginPath();c.arc(x,y-.1*k,r,0,7);c.fill();
      c.lineWidth=act.has(p.id)?.14*k:.06*k;c.strokeStyle=act.has(p.id)?"#fff":"rgba(255,255,255,.7)";c.stroke();
      c.fillStyle=o.lib?"#1b1b1b":"#fff";c.font=`700 ${.62*k}px Barlow Condensed,Arial Narrow,sans-serif`;c.textAlign="center";c.textBaseline="middle";c.fillText(p.role,x,y-.08*k);
    });
  }
  c.font=`600 ${.5*k}px Barlow,system-ui,sans-serif`;c.textAlign="center";c.textBaseline="alphabetic";
  for(const side of ["h","a"])M.view[side].forEach((o,i)=>{
    if(!act.has(o.p.id))return;
    const xy=ov[o.p.id]||slotXY(side,i),nm=o.p.name.split(" ").slice(-1)[0],w=c.measureText(nm).width+.5*k;
    const x=xy[0]*k,y=(xy[1]-.95)*k;
    c.fillStyle="rgba(10,15,25,.82)";c.fillRect(x-w/2,y-.5*k,w,.68*k);c.fillStyle="#fff";c.fillText(nm,x,y);
  });
  if(a&&a.stage==="steps"&&st){
    const f=clamp(a.t/st.d,0,1),sa=st.a||a.steps[0].a,x=lerp(sa[0],st.b[0],f),y=lerp(sa[1],st.b[1],f),z=st.arc*4*f*(1-f);
    ball=[x,y,z];
  }else if(a&&a.stage==="after"){const l=a.steps[a.steps.length-1];ball=[l.b[0],l.b[1],0];}
  if(ball){
    c.fillStyle="rgba(0,0,0,.3)";c.beginPath();c.ellipse(ball[0]*k,ball[1]*k+.1*k,.28*k,.16*k,0,0,7);c.fill();
    c.fillStyle="#fff";c.strokeStyle="#222";c.lineWidth=.05*k;c.beginPath();c.arc(ball[0]*k,(ball[1]-ball[2])*k,.3*k,0,7);c.fill();c.stroke();
    c.strokeStyle="#e0b020";c.beginPath();c.arc(ball[0]*k,(ball[1]-ball[2])*k,.3*k,.4,2.2);c.stroke();
  }
}

function finishMatch(){

function buyPlayer(pid){
  const p=G.freeAgents.find(x=>x.id===pid);
  if(!p)return;
  const cost=p.val||calcETV(p);
  if(G.budget<cost){toast("Budget societario insufficiente!");return;}
  G.budget-=cost;
  G.freeAgents=G.freeAgents.filter(x=>x.id!==pid);
  p.teamId=myTeam().id;
  p.lid=G.lid;
  p.fatigue=0;
  p.inj=0;
  myTeam().players.push(p);
  myTeam().players.sort((a,b)=>ROLE_ORDER.indexOf(a.role)-ROLE_ORDER.indexOf(b.role)||b.ovr-a.ovr);
  toast(`Acquisto completato: ${p.name}!`);
  persist();render();
}

function sellPlayer(pid){
  const t=myTeam();
  const idx=t.players.findIndex(x=>x.id===pid);
  if(idx<0)return;
  const p=t.players[idx];
  const price=Math.round((p.val||calcETV(p))*0.85);
  t.players.splice(idx,1);
  p.teamId=null;p.lid=null;
  G.freeAgents.push(p);
  G.budget+=price;
  toast(`Cessione completata: ${p.name} per ${formatEur(price)}!`);
  persist();render();
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.tagName==="SELECT")return;
  const act=el.dataset.act,v=el.dataset.v;
  if(act==="start"){newGame(el.dataset.lid,+el.dataset.i);return;}
  if(act==="continue"){
    const s=loadLocal();
    if(validSave(s)){
      G=s;UI.lg=G.lid;
      if(!G.budget)G.budget=initBudget(G.lid,myTeam().tier);
      if(!G.freeAgents)G.freeAgents=FREE_AGENTS.slice();
      if(!lineupValid(myTeam(),G.lineup))G.lineup=autoLineup(myTeam());
      render();
    }
    return;
  }
  if(act==="speed"){if(!UI.match)return;UI.match.speed=+v;document.querySelectorAll('[data-act="speed"]').forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));return;}
  if(act==="pause"){const M=UI.match;if(!M)return;M.paused=!M.paused;el.textContent=M.paused?"Riprendi":"Pausa";return;}
  if(act==="skip"){skipMatch();return;}
  if(act==="endmatch"){endMatch();return;}
  if(!G)return;
  if(act==="tab"){UI.tab=v;UI.sel=null;render();window.scrollTo(0,0);}
  else if(act==="mkttab"){UI.mktTab=v;render();}
  else if(act==="buyplayer"){buyPlayer(el.dataset.id);}
  else if(act==="sellplayer"){sellPlayer(el.dataset.id);}
  else if(act==="tactic"){G.tactic=v;persist();render();}
  else if(act==="play"){startMatch();window.scrollTo(0,0);}
  else if(act==="quick"){
    const fx=nextFixture(G);if(!fx||fx.rest)return;
    const home=WORLD[G.lid][fx.h],away=WORLD[G.lid][fx.a];
    const res=simMatch(home,away,{h:lineupFor(G,home),a:lineupFor(G,away)},{h:fx.home?G.tactic:"bal",a:fx.home?"bal":G.tactic},Math.random,false);
    const win=(fx.home?res.hs:res.as)>(fx.home?res.as:res.hs);
    const inc=fx.home?(win?8500:4200):(win?2500:800);
    G.budget+=inc;
    playRound(G,res);persist();render();
  }
  else if(act==="rest"){playRound(G,null);persist();render();}
  else if(act==="newseason"){
    G.round=0;G.season++;G.phase=1;
    G.results={A1:[],A2:[],A3A:[],A3B:[]};
    if(G.lid.includes("A3"))G.lid="A3A";
    G.budget+=Math.round(initBudget(G.lid,myTeam().tier)*0.6);
    persist();render();window.scrollTo(0,0);
  }
  else if(act==="reset"){if(!UI.confirm){UI.confirm=true;render();}else{UI.confirm=false;try{localStorage.removeItem(SAVE_KEY);}catch(x){}G=null;render();window.scrollTo(0,0);}}
  else if(act==="noreset"){UI.confirm=false;render();}
  else if(act==="player"){UI.sel=UI.sel===el.dataset.id?null:el.dataset.id;render();}
  else if(act==="autolineup"){G.lineup=autoLineup(myTeam());persist();render();}
  else if(act==="lg"){UI.lg=v;UI.rd=null;render();}
  else if(act==="lgtab"){UI.lgTab=v;render();}
  else if(act==="rd"){UI.rd=(UI.rd||0)+ +v;render();}
});
document.addEventListener("change",e=>{
  const el=e.target;if(!G||el.dataset.act!=="slot")return;
  const lu={...lineupFor(G,myTeam())};lu[el.dataset.k]=el.value;
  if(lineupValid(myTeam(),lu)){G.lineup=lu;persist();render();}
});
window.addEventListener("resize",()=>{if(UI.match)sizeCanvas();});

(function boot(){
  const s=loadLocal();
  if(validSave(s)){
    G=s;UI.lg=G.lid;
    if(!G.budget)G.budget=initBudget(G.lid,myTeam().tier);
    if(!G.freeAgents)G.freeAgents=FREE_AGENTS.slice();
    if(!lineupValid(myTeam(),G.lineup))G.lineup=autoLineup(myTeam());
  }
  render();
})();
</script>
