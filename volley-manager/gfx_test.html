<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>body{font-family:Barlow,sans-serif;background:#eef2f7;margin:20px}.crest{display:inline-block;width:var(--cs,64px);height:var(--cs,64px);margin:6px}.crest svg{width:100%;height:100%}
.avatar{position:relative;display:inline-block;width:var(--as,64px);height:var(--as,64px);margin:6px}.avatar svg{width:100%;height:100%}.av-role{position:absolute;right:-2px;bottom:-2px;background:#111;color:#fff;border-radius:50%;width:40%;height:40%;font:700 .7em Barlow;display:grid;place-items:center}</style></head><body>
<div id="c"></div><div id="a"></div>
<script src="js/gfx/kit.js"></script><script src="js/gfx/crest.js"></script><script src="js/gfx/avatar.js"></script>
<script src="js/data.js"></script>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WORLD={};
const all=[];for(const k of ["A1","A2","A3A","A3B"]){WORLD[k]=LEAGUES[k].teams.map(t=>({...t,lid:k}));all.push(...WORLD[k]);}
document.getElementById('c').innerHTML=all.map(t=>crest(t,64)).join("");
const ps=[];let n=0;for(const t of WORLD.A1.slice(0,3)){for(let i=0;i<8;i++){ps.push({id:t.id+i,name:"Prova "+(n++),lid:'A1',teamId:t.id,role:'SOCPL'[i%5],nat:'ITA'});}}
document.getElementById('a').innerHTML=ps.map(p=>avatar(p,72)).join("");
</script></body></html>
